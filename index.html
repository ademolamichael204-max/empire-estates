<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Empire Estates - Premium Property Group</title>
  <link href="https://googleapis.com" rel="stylesheet">
  <style>
    :root {
      --bg: #f7f5f0;
      --panel: #ffffff;
      --fg: #14202b;
      --muted: #5d6b78;
      --accent: #0b3a53;
      --gold: #c8962e;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--fg);
      font-family: 'DM Sans', sans-serif;
      overflow-x: hidden;
    }
    header {
      display: flex;
      justify-content: jb;
      align-items: center;
      padding: 1.5rem 2rem;
      max-width: 1200px;
      margin: 0 auto;
      width: 100%;
    }
    .brand {
      font-family: 'DM Serif Display', serif;
      font-size: 1.8rem;
      color: var(--accent);
    }
    .auth-buttons {
      display: flex;
      gap: 1rem;
    }
    .btn {
      padding: 0.75rem 1.5rem;
      border-radius: 0.5rem;
      font-weight: 700;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.2s ease;
    }
    .btn.outline {
      border: 1px solid var(--accent);
      color: var(--accent);
    }
    .btn.fill {
      background: var(--accent);
      color: #fff;
    }
    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(11, 58, 83, 0.15);
    }
    .hero {
      display: grid;
      grid-template-columns: 1fr 1fr;
      align-items: center;
      max-width: 1200px;
      margin: 4rem auto;
      padding: 0 2rem;
      gap: 2rem;
    }
    .hero-text h1 {
      font-family: 'DM Serif Display', serif;
      font-size: 3.5rem;
      line-height: 1.1;
      color: var(--fg);
      margin-bottom: 1.5rem;
    }
    .hero-text p {
      color: var(--muted);
      font-size: 1.1rem;
      margin-bottom: 2rem;
      max-width: 45ch;
    }
    .hero-image img {
      width: 100%;
      border-radius: 1.5rem;
      box-shadow: 0 20px 40px rgba(0,0,0,0.1);
    }
    @media (max-width: 768px) {
      .hero { grid-template-columns: 1fr; text-align: center; margin: 2rem auto; }
      .hero-text h1 { font-size: 2.5rem; }
      .hero-text p { margin: 1rem auto 2rem; }
    }
  </style>
</head>
<body>

  <header>
    <div class="brand">🏠 Empire Estates</div>
    <div class="auth-buttons">
      <!-- Clicking these redirects the user securely directly into your app.html portal -->
      <a href="./app.html" class="btn outline">Log In</a>
      <a href="./app.html" class="btn fill">Get Started</a>
    </div>
  </header>

  <main class="hero">
    <div class="hero-text">
      <div style="text-transform: uppercase; letter-spacing: 0.1em; color: var(--gold); font-weight: 700; margin-bottom: 0.5rem;">Welcome to Luxury Living</div>
      <h1>Find Your Next Premium Haven</h1>
      <p>Explore high-end signature houses, shops, modern corporate offices, and premium luxury rentals tailored specifically for your lifestyle portfolio.</p>
      <a href="./app.html" class="btn fill" style="display: inline-block;">Browse Active Listings</a>
    </div>
    <div class="hero-image">
      <img src="https://unsplash.com" alt="Premium Modern Villa Architecture">
    </div>
  </main>

</body>
</html>
