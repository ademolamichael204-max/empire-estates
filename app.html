<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f7f5f0">
  <title>Empire Estates Portal</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8F%A1%3C/text%3E%3C/svg%3E">
  
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11.12.4/dist/sweetalert2.all.min.js"></script>
  <script src="https://js.paystack.co/v1/inline.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=DM+Serif+Display&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #f7f5f0; --panel: #ffffff; --panel2: #f0ede6; --fg: #14202b; --muted: #5d6b78; --line: rgba(20, 32, 43, .13);
      --accent: #0b3a53; --on: #ffffff; --gold: #c8962e; --ok: #15803d; --bad: #b91c1c; --warn: #b45309;
      color-scheme: light;
    }
    :root[data-theme="dark"] {
      --bg: #0c1720; --panel: #13232f; --panel2: #1a2f3d; --fg: #eef2f5; --muted: #92a3b0; --line: rgba(255, 255, 255, .13);
      --accent: #d9a93f; --on: #1a1200; --gold: #d9a93f; --ok: #4ade80; --bad: #f87171; --warn: #fbbf24;
      color-scheme: dark;
    }
    * { box-sizing: border-box; margin: 0; padding: 0 }
    body { background: var(--bg); color: var(--fg); font-family: 'DM Sans', sans-serif; font-size: 15px; min-height: 100dvh; padding-top: 1rem; }
    h1, h2, h3 { font-family: 'DM Serif Display', serif; font-weight: 400; }
    button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
    .wrap { max-width: 1180px; margin: 0 auto; padding: 0 1.1rem }
    .fx { display: flex } .ac { align-items: center } .jb { justify-content: space-between }
    .muted { color: var(--muted) } .small { font-size: .82rem } .center { text-align: center }
    .btn { padding: .65rem 1.2rem; border-radius: .75rem; background: var(--accent); color: var(--on); font-weight: 700 }
    
    /* Navigation Bar */
    #top { position: sticky; top: 0; z-index: 50; background: var(--panel); border-bottom: 1px solid var(--line); padding: .6rem 0; margin-bottom: 2rem; }
    .brand { font-family: 'DM Serif Display', serif; font-size: 1.35rem; color: var(--fg); }
    .nav { display: flex; gap: .4rem; }
    .nav button { padding: .45rem .8rem; border-radius: 9999px; font-weight: 500; display: none; }
    .nav button.visible { display: inline-block; }
    .nav button.on { background: var(--accent); color: var(--on); }
    
    /* Layout Workspace grids */
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); gap: 1.1rem; margin-top: 1rem; }
    .lcard { background: var(--panel); border: 1px solid var(--line); border-radius: 1rem; padding: 1.5rem; }
    .stat-box { background: var(--panel2); padding: 1.5rem; border-radius: 12px; border: 1px solid var(--line); }
    .stat-box b { font-family: 'DM Serif Display', serif; font-size: 1.8rem; display: block; margin-top: 0.5rem; }
    .badge { background: var(--gold); color: #000; padding: 0.2rem 0.5rem; border-radius: 4px; font-size: 0.75rem; font-weight: bold; }
  </style>
</head>
<body>

  <!-- Dynamic Header Workspace Module Navigation -->
  <header id="top">
    <div class="wrap fx ac jb">
      <div class="brand">🏰 Empire Estates Portal</div>
      <div class="nav ac">
        <button id="nav-browse" class="visible on" onclick="switchView('browse')">Browse Properties</button>
        <button id="nav-admin" onclick="switchView('admin')">Admin Panel</button>
        <button id="nav-logout" class="visible" style="color: var(--bad);" onclick="handleLogout()">Sign Out</button>
      </div>
    </div>
  </header>

  <!-- Injection Target Node Container -->
  <main id="main" class="wrap"></main>

  <!-- Modular Script Runtime Execution Block -->
  <script type="module">
    // Alternative CDN locations to completely bypass local network CORS blockages
    import { initializeApp } from "https://jsdelivr.net";
    import { getAuth, onAuthStateChanged, signOut } from "https://jsdelivr.net";
    import { initializeFirestore, doc, getDoc, collection, getDocs } from "https://jsdelivr.net";

    const CFG = {
      firebase: {
        apiKey: "AIzaSyB2AeRD5eg_n7VmaUOKDQ", 
        authDomain: "://firebaseapp.com",
        projectId: "empireinc-b892a",
        storageBucket: "://appspot.com",
        messagingSenderId: "1059530431411",
        appId: "1:1059530431411:web:6e187cc809a47385903b41"
      }
    };

    const app = initializeApp(CFG.firebase);
    const auth = getAuth(app);
    const db = initializeFirestore(app, { experimentalAutoDetectLongPolling: true });

    let isAdminUser = false;

    // Track state session changes
    onAuthStateChanged(auth, async (user) => {
      const container = document.getElementById("main");
      if (user) {
        // Core override hook targeting your custom email profile parameters
        if (user.email === "ademolamichael204@gmail.com") {
          isAdminUser = true;
          document.getElementById("nav-admin").classList.add("visible");
          switchView("admin");
        } else {
          // Regular client verification fallback path
          try {
            const docSnap = await getDoc(doc(db, "users", user.uid));
            if (docSnap.exists() && docSnap.data().isAdmin === true) {
              isAdminUser = true;
              document.getElementById("nav-admin").classList.add("visible");
              switchView("admin");
              return;
            }
          } catch(e) { console.warn("Firestore collection lookup deferred."); }
          
          isAdminUser = false;
          document.getElementById("nav-admin").classList.remove("visible");
          switchView("browse");
        }
      } else {
        window.location.href = "./index.html";
      }
    });

    // Content Display Template: Marketplace listings
    async function renderBrowseView() {
      const container = document.getElementById("main");
      container.innerHTML = `
        <h2>Available Collections</h2>
        <p class="muted">Active real estate property allocations.</p>
        <div id="listings-grid" class="grid">
          <div class="center muted" style="padding: 2rem;">Loading listings portfolio...</div>
        </div>
      `;

      try {
        const snap = await getDocs(collection(db, "properties"));
        const grid = document.getElementById("listings-grid");
        grid.innerHTML = "";
        
        if (snap.empty) {
          grid.innerHTML = `<div class="muted">No current active estate listings published yet.</div>`;
          return;
        }

        snap.forEach((doc) => {
          const property = doc.data();
          grid.innerHTML += `
            <div class="lcard">
              <h3 style="color: var(--accent);">${property.title || "Elite Asset"}</h3>
              <p class="muted small">${property.location || "Premium District"}</p>
              <div class="price" style="margin-top:0.5rem; font-weight:bold; color:var(--gold);">$${property.price || "Contact info"}</div>
            </div>`;
        });
      } catch (err) {
        document.getElementById("listings-grid").innerHTML = `<div class="muted">Inventory currently empty. Create records in your Firebase panel to view live updates here.</div>`;
      }
    }

    // Content Display Template: Administrative Management Terminal Dashboard
    function renderAdminView() {
      const container = document.getElementById("main");
      container.innerHTML = `
        <div style="background: var(--panel); padding: 2rem; border-radius: 1rem; border:1px solid var(--line);">
          <div class="fx jb ac">
            <h2>Administrative System Settings</h2>
            <span class="badge">Privilege Tier 1</span>
          </div>
          <p class="muted" style="margin-top: 0.25rem;">Management control log for ademolamichael204@gmail.com</p>
          
          <div class="grid" style="margin-top: 2rem;">
            <div class="stat-box">
              <span>Managed Portfolios</span>
              <b>34 Active</b>
            </div>
            <div class="stat-box">
              <span>Pending Bookings</span>
              <b style="color: var(--warn);">3 Audits</b>
            </div>
            <div class="stat-box">
              <span>Gross Escrow Pipeline</span>
              <b style="color: var(--ok);">$1,249,000</b>
            </div>
          </div>
        </div>
      `;
    }

    // View Mapping Routing Logic
    window.switchView = function(view) {
      document.querySelectorAll(".nav button").forEach(b => b.classList.remove("on"));
      if (view === "admin") {
        if (!isAdminUser) {
          Swal.fire("Access Restrained", "Administrative login keys required.", "error");
          switchView("browse");
          return;
        }
        document.getElementById("nav-admin").classList.add("on");
        renderAdminView();
      } else {
        document.getElementById("nav-browse").classList.add("on");
        renderBrowseView();
      }
    };

    window.handleLogout = function() {
      signOut(auth).then(() => { window.location.href = "./index.html"; });
    };
  </script>
</body>
</html>
git add .
git commit -m "Configure direct admin guard override parameters for staff email verification"
