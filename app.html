<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Empire Estates | Portal</title>
  <script src="https://jsdelivr.net"></script>
  <link href="https://googleapis.com" rel="stylesheet">
  
  <style>
    :root {
      --bg: #f7f5f0; 
      --panel: #ffffff; 
      --panel2: #f0ede6; 
      --fg: #14202b; 
      --muted: #5d6b78; 
      --line: rgba(20, 32, 43, .13);
      --accent: #0b3a53; 
      --on: #ffffff; 
      --gold: #c8962e; 
      --ok: #15803d; 
      --bad: #b91c1c; 
      --warn: #b45309;
    }
    :root[data-theme="dark"] {
      --bg: #0c1720; 
      --panel: #13232f; 
      --panel2: #1a2f3d; 
      --fg: #eef2f5; 
      --muted: #92a3b0; 
      --line: rgba(255, 255, 255, .13);
      --accent: #d9a93f; 
      --on: #1a1200; 
      --gold: #d9a93f; 
      --ok: #4ade80; 
      --bad: #f87171; 
      --warn: #fbbf24;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { 
      background: var(--bg); 
      color: var(--fg); 
      font-family: 'DM Sans', sans-serif; 
      padding: 2rem 0; 
    }
    h2 { font-family: 'DM Serif Display', serif; font-size: 1.8rem; }
    .fx { display: flex; } 
    .ac { align-items: center; } 
    .jb { justify-content: space-between; }
    .muted { color: var(--muted); } 
    .dashboard-badge { 
      background: var(--gold); 
      color: #000; 
      padding: 0.2rem 0.5rem; 
      border-radius: 4px; 
      font-size: 0.8rem; 
    }
    #top { 
      border-bottom: 1px solid var(--line); 
      padding-bottom: 1rem; 
      margin-bottom: 2rem; 
    }
    .nav button { 
      padding: 0.5rem 1rem; 
      margin-left: 0.5rem; 
      border-radius: 20px; 
      font-weight: bold; 
      display: none; 
    }
    .nav button.visible { display: inline-block; }
    .nav button.on { background: var(--accent); color: #fff; }
    .grid { 
      display: grid; 
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); 
      gap: 1.5rem; 
    }
    .lcard { 
      background: var(--panel); 
      border: 1px solid var(--line); 
      border-radius: 12px; 
      padding: 1.5rem; 
    }
    .stat { 
      background: var(--panel2); 
      padding: 1.5rem; 
      border-radius: 8px; 
      margin-top: 1rem; 
    }
  </style>
</head>
<body>

  <!-- App Header Navigation Layout -->
  <header id="top" class="wrap fx ac jb">
    <div style="font-family: 'DM Serif Display', serif; font-size: 1.5rem;">🏰 Empire Portal</div>
    <div class="nav ac">
      <button id="nav-browse" class="on visible" onclick="switchView('browse')">Browse</button>
      <button id="nav-admin" onclick="switchView('admin')">Admin Panel</button>
      <button id="nav-logout" class="visible" style="color: var(--bad);" onclick="handleLogout()">Sign Out</button>
    </div>
  </header>

  <!-- Content Insertion Node -->
  <main id="main" class="wrap"></main>

  <!-- Complete Firebase System Logic Module -->
  <script type="module">
    import { initializeApp } from "https://gstatic.com";
    import { getAuth, onAuthStateChanged, signOut } from "https://gstatic.com";
    import { initializeFirestore, doc, getDoc, collection, getDocs } from "https://gstatic.com";

    // Firebase Security Configuration Parameters
    const CFG = {
      apiKey: "AIzaSyB2AeRD5eg_n7VmaUOKDQ", 
      authDomain: "://firebaseapp.com",
      projectId: "your-app-id",
      storageBucket: "://appspot.com",
      messagingSenderId: "1234567890",
      appId: "1:123456:web:abcdef"
    };

    const app = initializeApp(CFG);
    const auth = getAuth(app);
    const db = initializeFirestore(app, { experimentalAutoDetectLongPolling: true });

    let profile = null;

    // Monitor Client Session Authentication Changes
    onAuthStateChanged(auth, async (user) => {
      if (user) {
        try {
          const docSnap = await getDoc(doc(db, "users", user.uid));
          if (docSnap.exists() && docSnap.data().isAdmin === true) {
            profile = docSnap.data();
            document.getElementById("nav-admin").classList.add("visible");
            switchView("admin");
          } else {
            switchView("browse");
          }
        } catch (err) {
          console.error("Profile validation fail:", err);
          switchView("browse");
        }
      } else {
        window.location.href = "./index.html";
      }
    });

    // View Engine Template: Property Browser Marketplace
    async function renderBrowseView() {
      const container = document.getElementById("main");
      container.innerHTML = `
        <section style="padding: 2rem 0;">
          <h2>Signature Portfolios</h2>
          <p class="muted">Explore premium assets matching your portfolio criteria.</p>
          <div id="listings-grid" class="grid">
            <div class="center muted" style="padding: 2rem;">Loading listings...</div>
          </div>
        </section>
      `;

      try {
        const querySnapshot = await getDocs(collection(db, "properties"));
        const grid = document.getElementById("listings-grid");
        
        if (querySnapshot.empty) {
          grid.innerHTML = `<div class="muted">No active estate listings found.</div>`;
          return;
        }

        grid.innerHTML = "";
        querySnapshot.forEach((doc) => {
          const data = doc.data();
          grid.innerHTML += `
            <div class="lcard">
              <h3 style="color: var(--accent);">${data.title || "Asset"}</h3>
              <p class="muted small">${data.location || "Prime Location"}</p>
              <div class="price" style="margin-top: 1rem;">$${data.price || "Contact"}</div>
            </div>
          `;
        });
      } catch (err) {
        console.error("Listing population fail:", err);
      }
    }

    // View Engine Template: Executive Admin Panel Dashboard
    function renderAdminView() {
      const container = document.getElementById("main");
      container.innerHTML = `
        <div class="admin-container" style="background: var(--panel); border: 1px solid var(--line); padding: 2rem; border-radius: 12px;">
          <div class="fx jb ac">
            <h2>Executive Terminal Status</h2>
            <span class="dashboard-badge">System Live</span>
          </div>
          <p class="muted" style="margin-top: 0.5rem;">Accessing terminal state controls.</p>
          
          <div class="grid" style="margin-top: 2rem;">
            <div class="stat">
              <span>Total Managed Portfolios</span>
              <b style="display: block; font-size: 1.8rem; margin-top: 0.5rem;">34 Assets</b>
            </div>
            <div class="stat">
              <span>Pending Processing Files</span>
              <b style="display: block; font-size: 1.8rem; margin-top: 0.5rem; color: var(--warn);">3</b>
            </div>
            <div class="stat">
              <span>Verified Escrow Volume</span>
              <b style="display: block; font-size: 1.8rem; margin-top: 0.5rem; color: var(--ok);">$1.2M</b>
            </div>
          </div>
        </div>
      `;
    }

    // Global App Interface Router Maps
    window.switchView = function(view) {
      document.querySelectorAll(".nav button").forEach(b => b.classList.remove("on"));
      if (view === "admin" && profile?.isAdmin === true) {
        document.getElementById("nav-admin").classList.add("on");
        renderAdminView();
      } else {
        document.getElementById("nav-browse").classList.add("on");
        renderBrowseView();
      }
    };

    window.handleLogout = function() {
      signOut(auth).then(() => window.location.href = "./index.html");
    };
  </script>
</body>
</html>
