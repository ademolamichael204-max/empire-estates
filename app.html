<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f7f5f0">
  <title>Haven Estates - Houses, Shops, Offices &amp; Rentals</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8F%A1%3C/text%3E%3C/svg%3E">

  <script>
    (function () {
      var t = null;
      try { t = localStorage.getItem('estate-theme'); } catch (e) { }
      if (t !== 'light' && t !== 'dark') t = (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
      document.documentElement.setAttribute('data-theme', t);
    })();
  </script>

  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11.12.4/dist/sweetalert2.all.min.js"></script>
  <script src="https://js.paystack.co/v1/inline.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=DM+Serif+Display&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #f7f5f0; --panel: #ffffff; --panel2: #f0ede6; --fg: #14202b; --muted: #5d6b78; --line: rgba(20, 32, 43, .13);
      --accent: #0b3a53; --on: #ffffff; --gold: #c8962e; --ok: #15803d; --bad: #b91c1c; --warn: #b45309;
      color-scheme: light;
    }
    :root[data-theme="dark"] {
      --bg: #0c1720; --panel: #13232f; --panel2: #1a2f3d; --fg: #eef2f5; --muted: #92a3b0; --line: rgba(255, 255, 255, .13);
      --accent: #d9a93f; --on: #1a1200; --gold: #d9a93f; --ok: #4ade80; --bad: #f87171; --warn: #fbbf24;
      color-scheme: dark;
    }
    * { box-sizing: border-box; margin: 0; padding: 0 }
    html, body { 
      height: 100vh; 
      height: 100dvh; 
      overflow: hidden; 
    }
    
    /* Native App Master Container Framework */
    body { 
      background: var(--bg); 
      color: var(--fg); 
      font-family: 'DM Sans', system-ui, sans-serif; 
      font-size: 15px; 
      line-height: 1.5;
      display: flex;
      flex-direction: row;
    }

    h1, h2, h3 { font-family: 'DM Serif Display', Georgia, serif; font-weight: 400; line-height: 1.15 }
    h2 { font-size: 1.5rem; margin-bottom: .5rem } 
    h3 { font-size: 1.1rem }
    button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer }
    a { color: var(--accent); cursor: pointer; text-decoration: none }
    img { max-width: 100% }

    /* Fixed Application Scroll Workspace */
    #main {
      flex: 1;
      height: 100%;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding: 1.5rem;
    }
    .wrap { max-width: 100%; margin: 0; padding: 0; }

    /* Desktop Sidebar App Frame */
    #top { 
      width: 260px;
      height: 100vh;
      position: sticky;
      top: 0;
      background: var(--panel);
      border-right: 1px solid var(--line);
      border-bottom: none;
      padding: 1.5rem 1rem;
      display: flex;
      flex-direction: column;
      gap: 2rem;
      z-index: 100;
    }
    .brand { font-family: 'DM Serif Display', serif; font-size: 1.5rem; color: var(--accent); }
    
    .nav { 
      display: flex; 
      flex-direction: column; 
      gap: .5rem; 
      overflow-x: visible; 
    }
    .nav button { 
      width: 100%;
      text-align: left;
      padding: .75rem 1rem; 
      border-radius: .75rem; 
      font-weight: 600; 
      white-space: nowrap; 
      transition: background 0.2s;
    }
    .nav button:hover { background: var(--panel2) } 
    .nav button.on { background: var(--accent); color: var(--on) }

    /* Core Native Controls Utility Wrappers */
    .fx { display: flex } .ac { align-items: center } .jb { justify-content: space-between } .jc { justify-content: center } .fw { flex-wrap: wrap }
    .g2 { gap: .5rem } .g3 { gap: .8rem } .f1 { flex: 1; min-width: 0 }
    .muted { color: var(--muted) } .small { font-size: .82rem } .center { text-align: center }
    .inp, select, textarea { width: 100%; padding: .65rem .8rem; border-radius: .7rem; background: var(--panel); color: var(--fg); border: 1px solid var(--line); font: inherit; margin-bottom: .65rem }
    
    /* Optimized Compact Cards Grid Grid Layout */
    .grid { 
      display: grid; 
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); 
      gap: 1rem; 
      margin-top: 1rem;
    }
    .lcard { background: var(--panel); border: 1px solid var(--line); border-radius: 1rem; overflow: hidden; cursor: pointer; transition: transform .18s, box-shadow .18s }
    .lcard:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(0, 0, 0, .08) }
    .ph { position: relative; aspect-ratio: 16/10; background: var(--panel2); overflow: hidden }
    .ph img { width: 100%; height: 100%; object-fit: cover; display: block }
    .lb { padding: .8rem }
    .price { font-weight: 700; font-size: 1.1rem; color: var(--accent) }
    
    /* Native App Mobile Responsiveness Bottom Tab Bar */
    @media (max-width: 768px) {
      body { flex-direction: column; }
      #top {
        width: 100%;
        height: 60px;
        flex-direction: row;
        justify-content: space-between;
        align-items: center;
        padding: 0 1rem;
        border-right: none;
        border-bottom: 1px solid var(--line);
        position: fixed;
        top: 0;
      }
      #main {
        padding: 80px 1rem 80px;
      }
      .nav {
        position: fixed;
        bottom: 0;
        left: 0;
        width: 100%;
        height: 65px;
        background: var(--panel);
        border-top: 1px solid var(--line);
        flex-direction: row;
        justify-content: space-around;
        align-items: center;
        padding: 0 0.5rem;
        gap: 0;
      }
      .nav button {
        width: auto;
        height: 45px;
        padding: 0 1rem;
        border-radius: 20px;
        font-size: 0.85rem;
        text-align: center;
      }
    }
  </style>
</head>

<body>
  <div id="err"></div>
  <header id="top"></header>
  <main id="main"></main>
  <footer id="foot"></footer>
  <div id="modal" class="ov" onclick="if(event.target===this)closeModal()"><div id="mbox" class="mbox"><button class="mx" onclick="closeModal()" aria-label="Close">×</button><div id="mbody"></div></div></div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getAuth, onAuthStateChanged, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, sendPasswordResetEmail, GoogleAuthProvider, signInWithPopup } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
    import { initializeFirestore, doc, getDoc, getDocs, setDoc, addDoc, updateDoc, deleteDoc, arrayUnion, arrayRemove, collection, query, where, orderBy, limit, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    // =====================================================================
    // 1) PASTE YOUR KEYS HERE (see setup steps)
    // =====================================================================
    const CFG = {
      firebase: {
         apiKey: "AIzaSyB2AeRD5eg_n7VmaUOKDQTGEcUtfCHsCrc",
    authDomain: "empireinc-46a7a.firebaseapp.com",
    projectId: "empireinc-46a7a",
    storageBucket: "empireinc-46a7a.firebasestorage.app",
    messagingSenderId: "120270953383",
    appId: "1:120270953383:web:79b8e558bb21f25c4b3482"
      },
      paystackKey: "pk_test_YOUR_PAYSTACK_PUBLIC_KEY",
      brand: "Empire Inc",                 // can also be changed later in Admin > Settings
      cloudinary: { cloud: "", preset: "" }   // OPTIONAL: lets the admin upload video files (see setup steps)
    };

    const $ = id => document.getElementById(id);
    const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const toast = (title, icon = 'success') => Swal.fire({ toast: true, position: 'top-end', icon, title, showConfirmButton: false, timer: 2200, timerProgressBar: true });
    const money = n => '₦' + Number(n || 0).toLocaleString('en-NG');
    const dstr = t => t ? new Date(t).toLocaleDateString([], { day: 'numeric', month: 'short', year: 'numeric' }) : '';
    const tstr = t => new Date(t).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    const TL = { house: 'House', apartment: 'Apartment', shop: 'Shop', office: 'Office', land: 'Land' };
    const IC = { house: '🏠', apartment: '🏢', shop: '🏪', office: '💼', land: '🌳' };
    const RL = { inspection: 'Inspection', rent: 'Rent', buy: 'Purchase' };

    function showErr(where, e) {
      const code = e?.code || '', msg = e?.message || String(e); let hint = '';
      if (/index/i.test(msg)) hint = 'Open the browser console (F12) and click the link in the error to create the missing index.';
      else if (/permission-denied/.test(code) || /insufficient permissions/i.test(msg)) hint = 'Firestore rules are blocking this. Paste firestore.rules into Firebase Console > Firestore > Rules and click Publish. For admin actions, also make sure your account is listed in the "admins" collection.';
      else if (/unavailable|failed-precondition|not-found|deadline/.test(code) || /offline|reach/i.test(msg)) hint = 'Cannot reach Firestore. Check that the Firestore database is created, that you are online, and that no VPN or ad-blocker blocks firestore.googleapis.com.';
      $('err').innerHTML = `<b>${esc(where)}</b>: ${esc(code || msg)}${hint ? '<br><span>' + esc(hint) + '</span>' : ''}<button onclick="this.parentNode.style.display='none'" aria-label="Close">✕</button>`;
      $('err').style.display = 'block'; console.error(where, e);
    }

    if (CFG.firebase.apiKey.startsWith('YOUR')) {
      $('main').innerHTML = `<div class="wrap narrow" style="padding-top:3rem"><h2>Setup needed</h2><p class="muted">Open <b>index.html</b>, find <b>CFG</b> near the top of the script and paste your Firebase config and Paystack public key.</p></div>`;
      throw new Error('Config missing');
    }

    const fbApp = initializeApp(CFG.firebase), au = getAuth(fbApp), fs = initializeFirestore(fbApp, { experimentalAutoDetectLongPolling: true });

    // ===== state =====
    const S = { user: null, me: null, isAdmin: false, listings: [], anns: [], settings: {}, reqs: [], users: [], threads: [], thread: null, view: 'home', tab: 'dash', ready: false, hashDone: false, authOpen: false, draft: '', chatUid: null, chatMsgs: [], rf: { type: 'all', status: 'all' }, f: { purpose: 'all', type: 'all', q: '', max: '', sort: 'new' } };
    let pubUnsubs = [], userUnsubs = [], unsubChat = null, pendingProfile = null, G = null, ED = null, AE = null;
    const brand = () => S.settings.brand || CFG.brand;
    const feeOf = l => (l.inspectionFee !== null && l.inspectionFee !== undefined && l.inspectionFee !== '') ? +l.inspectionFee : +(S.settings.defaultFee || 0);
    const waNum = p => { let d = String(p || '').replace(/\D/g, ''); if (d.startsWith('0')) d = '234' + d.slice(1); return d };
    const unreadAdmin = () => S.threads.filter(t => t.unreadAdmin).length;

    // ===== images / video helpers =====
    const loadImg = src => new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = src });
    function toData(i, max, q) { const k = Math.min(1, max / Math.max(i.width, i.height)), c = document.createElement('canvas'); c.width = Math.round(i.width * k); c.height = Math.round(i.height * k); c.getContext('2d').drawImage(i, 0, 0, c.width, c.height); return c.toDataURL('image/jpeg', q) }
    async function compress(file, max = 1280) { const url = URL.createObjectURL(file); try { const i = await loadImg(url); let q = .74, d = toData(i, max, q); while (d.length > 850000 && q > .4) { q -= .1; d = toData(i, max, q) } return d } finally { URL.revokeObjectURL(url) } }
    async function thumb(data, max = 640) { return toData(await loadImg(data), max, .65) }
    function videoHtml(url) {
      url = String(url || '').trim(); if (!/^https?:\/\//i.test(url)) return '';
      const yt = url.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/|youtube\.com\/embed\/|youtube\.com\/shorts\/)([\w-]{11})/);
      if (yt) return `<iframe src="https://www.youtube.com/embed/${yt[1]}" allowfullscreen loading="lazy"></iframe>`;
      if (/\.(mp4|webm|ogg|mov)(\?.*)?$/i.test(url) || /res\.cloudinary\.com\/.+\/video\/upload/i.test(url)) return `<video controls preload="metadata" src="${esc(url)}"></video>`;
      return `<a class="btn2" target="_blank" rel="noopener" href="${esc(url)}">▶ Watch video ↗</a>`;
    }

    // ===== theme / modal =====
    const getTheme = () => document.documentElement.getAttribute('data-theme') === 'dark' ? 'dark' : 'light';
    const themeIcon = () => getTheme() === 'dark'
      ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>'
      : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z"/></svg>';
    function toggleTheme() { const t = getTheme() === 'dark' ? 'light' : 'dark'; document.documentElement.setAttribute('data-theme', t); try { localStorage.setItem('estate-theme', t) } catch { } document.querySelector('meta[name="theme-color"]').setAttribute('content', t === 'dark' ? '#0c1720' : '#f7f5f0'); renderTop() }
    function openModal(html, wide) { $('mbody').innerHTML = html; $('mbox').classList.toggle('wide', !!wide); $('modal').classList.add('show'); $('modal').scrollTop = 0; document.body.style.overflow = 'hidden' }
    function closeModal() { $('modal').classList.remove('show'); $('mbody').innerHTML = ''; document.body.style.overflow = ''; S.authOpen = false; G = null; if (location.hash.startsWith('#l=')) history.replaceState(null, '', location.pathname + location.search) }
    window.addEventListener('offline', () => toast('You are offline', 'warning')); window.addEventListener('online', () => toast('Back online'));

    // ===== auth =====
    function openAuth(mode) {
      const su = mode === 'signup'; S.authOpen = true;
      openModal(`<h2>${su ? 'Create your account' : 'Welcome back'}</h2><p class="muted small" style="margin-bottom:.8rem">${su ? 'Save homes, book inspections, pay securely and chat with us.' : 'Log in to continue.'}</p>
        ${su ? '<input id="a_n" class="inp" placeholder="Full name" autocomplete="name"><input id="a_ph" class="inp" type="tel" placeholder="Phone number" autocomplete="tel">' : ''}
        <input id="a_e" class="inp" type="email" placeholder="Email" autocomplete="email">
        <input id="a_p" class="inp" type="password" placeholder="Password (min 6 characters)" autocomplete="${su ? 'new-password' : 'current-password'}" onkeydown="if(event.key==='Enter')authGo('${mode}')">
        <button class="btn w100" onclick="authGo('${mode}')">${su ? 'Create account' : 'Log in'}</button>
        <div class="or">or</div><button class="btn2 w100" onclick="googleGo()">Continue with Google</button>
        <p class="center small" style="margin-top:.8rem"><a onclick="resetPw()">Forgot password?</a></p>
        <p class="center small" style="margin-top:.3rem"><a onclick="openAuth('${su ? 'login' : 'signup'}')">${su ? 'Have an account? Log in' : 'New here? Sign up'}</a></p>`);
    }
    async function authGo(mode) {
      const e = $('a_e').value.trim().toLowerCase(), p = $('a_p').value;
      if (!/^\S+@\S+\.\S+$/.test(e)) return toast('Enter a valid email', 'error');
      if (p.length < 6) return toast('Password must be at least 6 characters', 'error');
      try {
        if (mode === 'signup') {
          const name = $('a_n').value.trim(), phone = $('a_ph').value.trim();
          if (!name) return toast('Enter your name', 'error'); if (phone.replace(/\D/g, '').length < 7) return toast('Enter a valid phone number', 'error');
          pendingProfile = { name, phone }; await createUserWithEmailAndPassword(au, e, p);
        } else await signInWithEmailAndPassword(au, e, p);
      } catch (x) { pendingProfile = null; toast(x.code === 'auth/email-already-in-use' ? 'Account exists. Log in instead.' : (x.code === 'auth/invalid-credential' || x.code === 'auth/wrong-password') ? 'Incorrect email or password.' : x.message, 'error') }
    }
    async function googleGo() { try { await signInWithPopup(au, new GoogleAuthProvider()) } catch (x) { toast('Google sign-in failed: ' + x.message, 'error') } }
    function resetPw() { const e = $('a_e')?.value.trim(); if (!e) return toast('Type your email first', 'warning'); sendPasswordResetEmail(au, e).then(() => Swal.fire('Check your email', 'A reset link was sent if the account exists.', 'success')).catch(x => toast(x.message, 'error')) }
    async function ensureProfile(user) {
      let snap; try { snap = await getDoc(doc(fs, 'users', user.uid)) } catch (e) { return showErr('Loading your profile', e) }
      if (snap.exists()) { updateDoc(doc(fs, 'users', user.uid), { lastLogin: Date.now() }).catch(() => { }); return }
      let p = pendingProfile; pendingProfile = null;
      if (!p) {
        const r = await Swal.fire({ title: 'Complete your profile', allowOutsideClick: false, allowEscapeKey: false, confirmButtonText: 'Save', html: `<input id="cp_n" class="inp" placeholder="Full name" value="${esc(user.displayName || '')}"><input id="cp_p" class="inp" type="tel" placeholder="Phone number">`, preConfirm: () => { const name = $('cp_n').value.trim(), phone = $('cp_p').value.trim(); if (!name) return Swal.showValidationMessage('Enter your name'); if (phone.replace(/\D/g, '').length < 7) return Swal.showValidationMessage('Enter a valid phone number'); return { name, phone } } });
        p = r.value;
      }
      try { await setDoc(doc(fs, 'users', user.uid), { uid: user.uid, name: p.name, phone: p.phone, email: user.email, saved: [], createdAt: Date.now(), lastLogin: Date.now() }) } catch (e) { showErr('Saving your profile', e) }
    }
    async function profile() {
      const u = S.me || {};
      const r = await Swal.fire({ title: 'Your profile', showCancelButton: true, confirmButtonText: 'Save', showDenyButton: true, denyButtonText: 'Log out', html: `<label class="lbl">Name</label><input id="pf_n" class="inp" value="${esc(u.name)}"><label class="lbl">Phone</label><input id="pf_p" class="inp" type="tel" value="${esc(u.phone)}"><label class="lbl">Email</label><input class="inp" value="${esc(S.user.email)}" disabled>${S.isAdmin ? '<p class="small ok">✓ You are an admin</p>' : ''}`, preConfirm: () => { const name = $('pf_n').value.trim(); if (!name) return Swal.showValidationMessage('Name cannot be empty'); return { name, phone: $('pf_p').value.trim() } } });
      if (r.isDenied) { await signOut(au); toast('Logged out', 'info'); return }
      if (r.isConfirmed) { await updateDoc(doc(fs, 'users', S.user.uid), r.value).catch(e => showErr('Saving profile', e)); toast('Profile updated') }
    }

    // ===== data listeners =====
    function startPublic() {
      pubUnsubs.push(onSnapshot(query(collection(fs, 'listings'), orderBy('createdAt', 'desc')), s => {
        S.listings = s.docs.map(d => ({ id: d.id, ...d.data() })); S.ready = true; refresh();
        if (!S.hashDone && location.hash.startsWith('#l=')) { S.hashDone = true; openListing(location.hash.slice(3)) }
      }, e => showErr('Loading properties', e)));
      pubUnsubs.push(onSnapshot(query(collection(fs, 'announcements'), orderBy('createdAt', 'desc')), s => { S.anns = s.docs.map(d => ({ id: d.id, ...d.data() })); refresh() }, e => showErr('Loading announcements', e)));
      pubUnsubs.push(onSnapshot(doc(fs, 'settings', 'site'), s => { S.settings = s.exists() ? s.data() : {}; renderTop(); renderFoot(); const h = $('heroT'); if (h && S.settings.tagline) h.textContent = S.settings.tagline }, () => { }));
    }
    function stopUser() { userUnsubs.forEach(f => f()); userUnsubs = []; if (unsubChat) unsubChat(); unsubChat = null }
    async function startUser(u) {
      let admin = false; try { admin = (await getDoc(doc(fs, 'admins', u.uid))).exists() } catch { }
      S.isAdmin = admin;
      userUnsubs.push(onSnapshot(doc(fs, 'users', u.uid), s => { S.me = s.exists() ? s.data() : null; refresh() }, e => showErr('Loading profile', e)));
      userUnsubs.push(onSnapshot(admin ? query(collection(fs, 'requests'), orderBy('createdAt', 'desc')) : query(collection(fs, 'requests'), where('uid', '==', u.uid)), s => {
        S.reqs = s.docs.map(d => ({ id: d.id, ...d.data() })).sort((a, b) => b.createdAt - a.createdAt); refresh();
      }, e => showErr('Loading requests', e)));
      userUnsubs.push(onSnapshot(doc(fs, 'threads', u.uid), s => { S.thread = s.exists() ? s.data() : null; renderTop() }, () => { }));
      if (admin) {
        userUnsubs.push(onSnapshot(collection(fs, 'users'), s => { S.users = s.docs.map(d => d.data()).sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0)); refresh() }, e => showErr('Loading users', e)));
        userUnsubs.push(onSnapshot(collection(fs, 'threads'), s => { S.threads = s.docs.map(d => d.data()).sort((a, b) => (b.lastAt || 0) - (a.lastAt || 0)); renderTop(); if (S.view === 'admin' && S.tab === 'messages') renderThreadList() }, e => showErr('Loading messages', e)));
      }
    }
    onAuthStateChanged(au, async u => {
      stopUser(); Object.assign(S, { user: u, me: null, isAdmin: false, reqs: [], users: [], threads: [], thread: null, chatUid: null });
      if (u) { if (S.authOpen) closeModal(); await ensureProfile(u); await startUser(u) }
      if (!u && ['saved', 'mine', 'chat', 'admin'].includes(S.view)) S.view = 'home';
      if (u && S.view === 'admin' && !S.isAdmin) S.view = 'home';
      show();
    });

    // ===== navigation / rendering =====
    function go(v) {
      if (['saved', 'mine', 'chat'].includes(v) && !S.user) return openAuth('login');
      if (v === 'admin' && !S.isAdmin) return;
      if (v !== 'chat' && !(v === 'admin' && S.tab === 'messages') && unsubChat) { unsubChat(); unsubChat = null }
      S.view = v; show(); scrollTo(0, 0);
    }
    function show() { renderTop(); ({ home: viewHome, saved: viewSaved, mine: viewMine, chat: viewChat, admin: viewAdmin }[S.view])(); renderFoot() }
    function refresh() { renderTop(); renderFoot(); const v = S.view; if (v === 'home') { renderAnns(); renderGrid() } else if (v === 'saved') viewSaved(); else if (v === 'mine') viewMine(); else if (v === 'admin') refreshAdmin() }
    function renderTop() {
      const un = S.isAdmin ? unreadAdmin() : (S.thread?.unreadUser ? 1 : 0);
      const nav = [['home', 'Browse'], ...(S.user ? [['saved', '♥ Saved'], ['mine', 'My activity']] : []), ...(S.user && !S.isAdmin ? [['chat', 'Messages']] : []), ...(S.isAdmin ? [['admin', 'Admin']] : [])];
      $('top').innerHTML = `<div class="wrap fx ac jb g3"><a class="brand" onclick="go('home')">🏡 ${esc(brand())}</a>

        <div class="desc">${esc(l.desc)}</div>

        <div class="fx g2 fw"><button class="btn2 f1" onclick="askAdmin('${id}')">💬 Message admin</button><button id="svbtn" class="btn2 f1" onclick="toggleSave('${id}')">${saved ? '♥ Saved' : '♡ Save'}</button><button class="btn2 f1" onclick="shareL('${id}')">🔗 Share</button></div>
        ${ph ? `<div class="fx g2"><a class="btn2 f1 center" href="tel:${esc(ph)}">📞 Call</a><a class="btn2 f1 center" target="_blank" rel="noopener" href="https://wa.me/${waNum(ph)}?text=${encodeURIComponent('Hi, I am interested in: ' + l.title)}">WhatsApp</a></div>` : ''}</div></div></div>
        ${vids.length ? `<h3 style="margin-top:1.2rem">Videos</h3><div class="vids">${vids.join('')}</div>` : ''}`, true);
      try { const s = await getDocs(query(collection(fs, 'listings', id, 'media'), orderBy('n'))); if ($('gmain')) { G = { imgs: s.docs.map(d => d.data().data), i: 0 }; renderGal() } } catch (e) { showErr('Loading photos', e) }

      $('gthumbs').innerHTML = im.length > 1 ? im.map((s, i) => `<img class="${i === G.i ? 'on' : ''}" src="${s}" onclick="galSet(${i})" alt="">`).join('') : '';
    }
    const galGo = d => { if (G) { G.i = (G.i + d + G.imgs.length) % G.imgs.length; renderGal() } };
    const galSet = i => { if (G) { G.i = i; renderGal() } };
    function shareL(id) {
      const url = location.origin + location.pathname + '#l=' + id, l = S.listings.find(x => x.id === id);
      if (navigator.share) navigator.share({ title: l?.title, url }).catch(() => { }); else navigator.clipboard?.writeText(url).then(() => toast('Link copied'));

    function askAdmin(id) {
      if (!S.user) return openAuth('login'); const l = S.listings.find(x => x.id === id);

    // ===== payments & requests =====
    function payThen(amount, label, done) {
      if (!window.PaystackPop) return Swal.fire('Paystack failed to load', 'Check your connection or ad-blocker.', 'error');
      PaystackPop.setup({
        key: CFG.paystackKey, email: S.user.email, amount: Math.round(amount * 100), currency: 'NGN', ref: 'HV_' + Date.now(),
        metadata: { custom_fields: [{ display_name: 'Item', variable_name: 'item', value: label }] },
        onClose() { toast('Payment cancelled', 'info') },
        callback(r) { done(r.reference) }
      }).openIframe();
    }
    async function createRequest({ type, l, amount, ref, date, note }) {
      try {
        await addDoc(collection(fs, 'requests'), { uid: S.user.uid, userName: S.me?.name || '', userEmail: S.user.email, userPhone: S.me?.phone || '', listingId: l.id, listingTitle: l.title, type, amount: amount || 0, paid: !!ref, paystackRef: ref || null, verified: false, date: date || null, note: note || '', status: 'pending', createdAt: Date.now() });
        closeModal(); Swal.fire({ icon: 'success', title: 'Request sent ✅', html: `<p class="small">${type === 'inspection' ? 'Your inspection is booked. We will confirm the time shortly.' : type === 'rent' ? 'Your rental request is received. We will contact you to complete the process.' : 'Your purchase request is received. We will contact you shortly.'}${ref ? `<br><br>Payment reference: <b>${esc(ref)}</b>` : ''}</p>`, confirmButtonText: 'View my activity' }).then(() => go('mine'));
      } catch (e) { showErr('Saving request', e); if (ref) Swal.fire('Payment received', `Your payment went through but we could not save the request. Keep this reference and message us: ${ref}`, 'warning') }
    }
    async function bookInspection(id) {
      if (!S.user) return openAuth('login'); const l = S.listings.find(x => x.id === id), fee = feeOf(l), min = new Date(Date.now() + 36e5).toISOString().slice(0, 16);
      const r = await Swal.fire({ title: 'Book an inspection', showCancelButton: true, confirmButtonText: fee ? `Pay ${money(fee)} & book` : 'Book inspection', html: `<p class="small muted" style="margin-bottom:.6rem">${esc(l.title)}</p><label class="lbl">Preferred date &amp; time</label><input id="bi_d" type="datetime-local" class="inp" min="${min}"><label class="lbl">Note (optional)</label><textarea id="bi_n" class="inp" rows="2" placeholder="Anything we should know?"></textarea><p class="small">${fee ? `Inspection fee: <b>${money(fee)}</b>, paid securely with Paystack.` : 'Inspection is free.'}</p>`, preConfirm: () => { const d = $('bi_d').value; if (!d) return Swal.showValidationMessage('Pick a date and time'); if (new Date(d) < new Date()) return Swal.showValidationMessage('Choose a future date'); return { date: d, note: $('bi_n').value.trim() } } });
      if (!r.isConfirmed) return;
      const finish = ref => createRequest({ type: 'inspection', l, amount: fee, ref, date: r.value.date, note: r.value.note });
      fee > 0 ? payThen(fee, 'Inspection: ' + l.title, finish) : finish(null);
    }
    async function startDeal(id, type) {
      if (!S.user) return openAuth('login'); const l = S.listings.find(x => x.id === id);
      const pay = +l.payNow > 0 ? +l.payNow : (type === 'rent' ? +l.price : 0);
      const text = type === 'rent' ? (pay ? `Pay <b>${money(pay)}</b> now to secure this rental. The admin will contact you to complete the agreement.` : 'Send a rental request. The admin will contact you.') : (pay ? `Pay a deposit of <b>${money(pay)}</b> to reserve this property. The admin will contact you to complete the purchase.` : 'Send a purchase request. The admin will contact you.');
      const r = await Swal.fire({ title: type === 'rent' ? 'Rent this property' : 'Buy / reserve', showCancelButton: true, confirmButtonText: pay ? `Pay ${money(pay)}` : 'Send request', html: `<p class="small muted" style="margin-bottom:.5rem">${esc(l.title)}</p><p class="small" style="margin-bottom:.6rem">${text}</p><label class="lbl">Note (optional)</label><textarea id="dl_n" class="inp" rows="2"></textarea>`, preConfirm: () => $('dl_n').value.trim() });
      if (!r.isConfirmed) return;
      const finish = ref => createRequest({ type, l, amount: pay, ref, note: r.value });
      pay > 0 ? payThen(pay, (type === 'rent' ? 'Rent: ' : 'Deposit: ') + l.title, finish) : finish(null);
    }

    }
    const reqTable = list => `<div class="tw"><table class="tbl"><thead><tr><th>Property</th><th>Customer</th><th>Type</th><th>Payment</th><th>Status</th><th></th></tr></thead><tbody>${reqRows(list)}</tbody></table></div>`;
    const setReqStatus = (id, v) => updateDoc(doc(fs, 'requests', id), { status: v }).then(() => toast('Status updated')).catch(e => showErr('Updating', e));
    const toggleVerify = (id, v) => updateDoc(doc(fs, 'requests', id), { verified: v }).catch(e => showErr('Updating', e));
    async function delReq(id) { const r = await Swal.fire({ title: 'Delete this request?', icon: 'warning', showCancelButton: true, confirmButtonText: 'Delete' }); if (r.isConfirmed) deleteDoc(doc(fs, 'requests', id)).then(() => toast('Deleted', 'info')).catch(e => showErr('Deleting', e)) }

    function tDash() {
      const rev = S.reqs.filter(r => r.paid).reduce((a, r) => a + (+r.amount || 0), 0), st = (n, l) => `<div class="stat"><b>${n}</b><span>${l}</span></div>`;
      $('atab').innerHTML = `<div class="stats">${st(S.listings.length, 'Properties')}${st(S.listings.filter(l => l.status === 'available').length, 'Available')}${st(S.users.length, 'Registered users')}${st(S.reqs.filter(r => r.status === 'pending').length, 'Pending requests')}${st(S.reqs.filter(r => r.type === 'inspection').length, 'Inspections')}${st(S.reqs.filter(r => r.type === 'rent').length, 'Rent requests')}${st(S.reqs.filter(r => r.type === 'buy').length, 'Purchase requests')}${st(money(rev), 'Payments received')}</div><h3 style="margin-bottom:.6rem">Latest requests</h3>${reqTable(S.reqs.slice(0, 8))}<p class="small muted" style="margin-top:.6rem">Payments are recorded from the customer's browser. Always confirm the reference on your Paystack dashboard, then click "mark verified".</p>`;
    }
    function tRequests() {
      const f = S.rf, a = S.reqs.filter(r => (f.type === 'all' || r.type === f.type) && (f.status === 'all' || r.status === f.status));
      $('atab').innerHTML = `<div class="fx g2 fw" style="margin-bottom:.8rem"><select style="width:auto;margin:0" onchange="setRF('type',this.value)">${[['all', 'All types'], ['inspection', 'Inspections'], ['rent', 'Rent'], ['buy', 'Purchase']].map(([k, v]) => `<option value="${k}" ${f.type === k ? 'selected' : ''}>${v}</option>`).join('')}</select><select style="width:auto;margin:0" onchange="setRF('status',this.value)">${['all', 'pending', 'confirmed', 'completed', 'cancelled'].map(k => `<option value="${k}" ${f.status === k ? 'selected' : ''}>${k === 'all' ? 'All statuses' : k}</option>`).join('')}</select><span class="muted small" style="align-self:center">${a.length} request(s)</span></div>${reqTable(a)}`;
    }
    const setRF = (k, v) => { S.rf[k] = v; tRequests() };

    // ===== admin: users =====
    let uq = '';
    function tUsers() {
      $('atab').innerHTML = `<input class="inp" style="max-width:340px" placeholder="Search name, email or phone" value="${esc(uq)}" oninput="uq_set(this.value)"><div id="utbl"></div>`; renderUsersTable();
    }
    const uq_set = v => { uq = v.toLowerCase(); renderUsersTable() };
    function renderUsersTable() {
      const el = $('utbl'); if (!el) return;
      const a = S.users.filter(u => !uq || (u.name + ' ' + u.email + ' ' + (u.phone || '')).toLowerCase().includes(uq));
      el.innerHTML = `<div class="tw"><table class="tbl"><thead><tr><th>User</th><th>Phone</th><th>Joined</th><th>Requests</th><th>Saved</th><th></th></tr></thead><tbody>${a.map(u => {
        const rs = S.reqs.filter(r => r.uid === u.uid);
        return `<tr><td><b>${esc(u.name)}</b><br><span class="small muted">${esc(u.email)}</span></td><td>${esc(u.phone || '—')}</td><td>${dstr(u.createdAt)}</td><td>${rs.length}${rs.filter(r => r.status === 'pending').length ? ` <span class="badge s-pending">${rs.filter(r => r.status === 'pending').length} pending</span>` : ''}</td><td>${(u.saved || []).length}</td><td><button class="lnk" onclick="openUser('${u.uid}')">View details</button></td></tr>`;
      }).join('') || '<tr><td colspan="6" class="muted center">No users found.</td></tr>'}</tbody></table></div>`;
    }
    function openUser(uid) {
      const u = S.users.find(x => x.uid === uid); if (!u) return; const rs = S.reqs.filter(r => r.uid === uid), saved = S.listings.filter(l => (u.saved || []).includes(l.id));
      const th = l => l?.cover ? `<img class="th" src="${l.cover}" alt="">` : '<div class="th">🏠</div>';
      openModal(`<h2>${esc(u.name)}</h2><p class="muted small">${esc(u.email)} · ${esc(u.phone || 'no phone')}<br>Joined ${dstr(u.createdAt)}${u.lastLogin ? ' · last login ' + dstr(u.lastLogin) : ''}</p>
        <div class="fx g2" style="margin:.8rem 0"><button class="btn" onclick="msgUser('${uid}')">💬 Message</button>${u.phone ? `<a class="btn2" target="_blank" rel="noopener" href="https://wa.me/${waNum(u.phone)}">WhatsApp</a><a class="btn2" href="tel:${esc(u.phone)}">Call</a>` : ''}</div>
        <h3 style="margin:.6rem 0">Properties picked (${rs.length})</h3>${rs.map(r => { const l = S.listings.find(x => x.id === r.listingId); return `<div class="fx ac g2" style="padding:.4rem 0;border-bottom:1px solid var(--line)">${th(l)}<div class="f1"><b class="tr">${esc(r.listingTitle)}</b><br><span class="badge b-${r.type}">${RL[r.type]}</span> ${statusBadge(r.status)}${r.date ? ` <span class="small muted">${esc(r.date.replace('T', ' '))}</span>` : ''}</div><div class="small">${r.amount ? money(r.amount) : ''}</div></div>` }).join('') || '<p class="muted small">No requests yet.</p>'}
        <h3 style="margin:1rem 0 .6rem">Saved properties (${saved.length})</h3>${saved.map(l => `<div class="fx ac g2" style="padding:.3rem 0">${th(l)}<span class="tr">${esc(l.title)}</span></div>`).join('') || '<p class="muted small">None.</p>'}`, true);
    }
    function msgUser(uid) { closeModal(); S.tab = 'messages'; viewAdmin(); pickThread(uid) }

    // ===== admin: messages =====
    function tMessages() {
      $('atab').innerHTML = `<div class="two"><div class="tl" id="tlist"></div><div id="tchat"><div class="note">Select a conversation.</div></div></div>`; renderThreadList();
      if (S.chatUid && S.chatUid !== S.user.uid) pickThread(S.chatUid);
    }
    function renderThreadList() {
      const el = $('tlist'); if (!el) return;
      el.innerHTML = S.threads.map(t => `<div class="tli ${S.chatUid === t.uid ? 'on' : ''}" onclick="pickThread('${t.uid}')"><div class="fx jb"><b class="tr">${esc(t.name || t.email)}</b>${t.unreadAdmin ? '<span class="dot">new</span>' : ''}</div><div class="small muted tr">${esc(t.lastMsg || '')}</div><div class="small muted">${t.lastAt ? dstr(t.lastAt) + ' ' + tstr(t.lastAt) : ''}</div></div>`).join('') || '<p class="muted small" style="padding:1rem">No conversations yet.</p>';
    }
    function pickThread(uid) {
      const t = S.threads.find(x => x.uid === uid) || S.users.find(x => x.uid === uid) || {};
      openChatFor(uid); renderThreadList();
      $('tchat').innerHTML = `<div class="fx ac jb" style="margin-bottom:.5rem"><div><b>${esc(t.name || 'Customer')}</b><br><span class="small muted">${esc(t.email || '')}</span></div><button class="lnk" onclick="openUser('${uid}')">View details</button></div>${chatPane(uid)}`;
      renderChatMsgs();
    }

    // ===== admin: properties =====
    function tListings() {
      $('atab').innerHTML = `<div class="fx jb ac" style="margin-bottom:.8rem"><span class="muted small">${S.listings.length} propert${S.listings.length === 1 ? 'y' : 'ies'}</span><button class="btn" onclick="editListing()">＋ Add property</button></div>
      <div class="tw"><table class="tbl"><thead><tr><th>Property</th><th>Type</th><th>Price</th><th>Status</th><th></th></tr></thead><tbody>${S.listings.map(l => `<tr><td><div class="fx ac g2">${l.cover ? `<img class="th" src="${l.cover}" onclick="openListing('${l.id}')" alt="">` : '<div class="th">🏠</div>'}<div><b>${esc(l.title)}</b>${l.featured ? ' ★' : ''}<br><span class="small muted">${esc(l.location)} · ${l.imgCount || 0} photo(s)${(l.videos || []).length ? ' · ' + l.videos.length + ' video(s)' : ''}</span></div></div></td><td>${TL[l.type]}<br><span class="small muted">${l.purpose === 'rent' ? 'Rent' : 'Sale'}</span></td><td>${money(l.price)}</td>
      <td><select onchange="setLStatus('${l.id}',this.value)">${['available', 'sold', 'rented'].map(s => `<option ${l.status === s ? 'selected' : ''}>${s}</option>`).join('')}</select></td>
      <td class="fx g2" style="border:0"><button class="lnk" onclick="editListing('${l.id}')">Edit</button><button class="lnk bad" onclick="delListing('${l.id}')">Delete</button></td></tr>`).join('') || '<tr><td colspan="5" class="muted center">No properties yet. Click “Add property”.</td></tr>'}</tbody></table></div>`;
    }
    const setLStatus = (id, v) => updateDoc(doc(fs, 'listings', id), { status: v }).then(() => toast('Status updated')).catch(e => showErr('Updating', e));
    async function delListing(id) {
      const l = S.listings.find(x => x.id === id), r = await Swal.fire({ title: 'Delete this property?', text: `"${l?.title}" and all its photos will be removed for everyone.`, icon: 'warning', showCancelButton: true, confirmButtonText: 'Delete' });
      if (!r.isConfirmed) return;
      try { const m = await getDocs(collection(fs, 'listings', id, 'media')); await Promise.all(m.docs.map(d => deleteDoc(d.ref))); await deleteDoc(doc(fs, 'listings', id)); toast('Property deleted', 'info') } catch (e) { showErr('Deleting property', e) }
    }
    const opt = (list, cur) => list.map(([k, v]) => `<option value="${k}" ${cur === k ? 'selected' : ''}>${v}</option>`).join('');
    async function editListing(id) {
      const L = id ? S.listings.find(x => x.id === id) : { type: 'house', purpose: 'sale', status: 'available', period: 'year', features: [], videos: [], inspectionFee: null, payNow: 0, featured: false };
      ED = { id: id || null, items: [], removed: [] };
      const v = x => esc(x ?? '');
      openModal(`<h2>${id ? 'Edit property' : 'Add property'}</h2><div class="frm">
        <div class="full"><label class="lbl">Title</label><input id="e_title" class="inp" value="${v(L.title)}" placeholder="e.g. 4-bedroom duplex with BQ"></div>
        <div><label class="lbl">Type</label><select id="e_type">${opt(Object.entries(TL), L.type)}</select></div>
        <div><label class="lbl">Purpose</label><select id="e_purpose">${opt([['sale', 'For sale'], ['rent', 'For rent']], L.purpose)}</select></div>
        <div><label class="lbl">Price (₦)</label><input id="e_price" class="inp" type="number" min="0" value="${v(L.price)}"></div>
        <div><label class="lbl">Rent period</label><select id="e_period">${opt([['year', 'per year'], ['month', 'per month']], L.period)}</select></div>
        <div><label class="lbl">Location (area, city)</label><input id="e_loc" class="inp" value="${v(L.location)}"></div>
        <div><label class="lbl">Address (optional)</label><input id="e_addr" class="inp" value="${v(L.address)}"></div>
        <div><label class="lbl">Bedrooms</label><input id="e_beds" class="inp" type="number" min="0" value="${v(L.beds)}"></div>
        <div><label class="lbl">Bathrooms</label><input id="e_baths" class="inp" type="number" min="0" value="${v(L.baths)}"></div>
        <div><label class="lbl">Size (m²)</label><input id="e_size" class="inp" type="number" min="0" value="${v(L.size)}"></div>
        <div><label class="lbl">Status</label><select id="e_status">${opt([['available', 'Available'], ['sold', 'Sold'], ['rented', 'Rented']], L.status)}</select></div>
        <div><label class="lbl">Inspection fee (₦, blank = default)</label><input id="e_fee" class="inp" type="number" min="0" value="${v(L.inspectionFee)}"></div>
        <div><label class="lbl">Pay-now amount (₦)</label><input id="e_pay" class="inp" type="number" min="0" value="${v(L.payNow)}" placeholder="deposit / first payment"></div>
        <div class="full"><label class="lbl">Features (comma separated)</label><input id="e_feat" class="inp" value="${v((L.features || []).join(', '))}" placeholder="Swimming pool, 24h power, Fenced, CCTV"></div>
        <div class="full"><label class="lbl">Description</label><textarea id="e_desc" class="inp" rows="5" placeholder="Describe the property...">${v(L.desc)}</textarea></div>
        <div class="full"><label class="lbl">Photos <span id="e_cnt" class="muted"></span> (first photo is the cover)</label><div id="e_media" class="mgrid"></div><input type="file" accept="image/*" multiple onchange="edAdd(this)"></div>
        <div class="full" style="margin-top:.6rem"><label class="lbl">Video links (one per line: YouTube or direct .mp4 link)</label><textarea id="e_videos" class="inp" rows="2">${v((L.videos || []).join('\n'))}</textarea>${CFG.cloudinary.cloud ? '<button class="btn2" onclick="uploadVideo()">⬆ Upload a video file</button>' : '<p class="small muted">Tip: upload videos to YouTube (unlisted) or Cloudinary and paste the link here.</p>'}</div>
        <div class="full" style="margin:.8rem 0"><label><input id="e_featured" type="checkbox" ${L.featured ? 'checked' : ''}> ★ Feature this property (shows first)</label></div></div>
        <button class="btn w100" onclick="saveListing()">${id ? 'Save changes' : 'Publish property'}</button>`, true);
      renderEdMedia();
      if (id) { try { const s = await getDocs(query(collection(fs, 'listings', id, 'media'), orderBy('n'))); ED.items = s.docs.map(d => ({ id: d.id, data: d.data().data, n: d.data().n, n0: d.data().n })); renderEdMedia() } catch (e) { showErr('Loading photos', e) } }
    }
    function renderEdMedia() {
      const el = $('e_media'); if (!el || !ED) return; ED.items.sort((a, b) => a.n - b.n);
      el.innerHTML = ED.items.map((m, i) => `<div class="mi ${i === 0 ? 'cover' : ''}"><img src="${m.data}" alt=""><span class="cv">${i === 0 ? 'COVER' : ''}</span><div class="mt">${i ? `<button onclick="edCover(${i})" title="Make cover">★</button>` : ''}<button onclick="edDel(${i})" title="Remove">🗑</button></div></div>`).join('') || '<p class="muted small">No photos yet.</p>';
      $('e_cnt').textContent = ED.items.length + '/12';
    }
    async function edAdd(inp) {
      const files = [...inp.files]; inp.value = ''; if (!files.length) return;
      if (ED.items.length + files.length > 12) return toast('Maximum 12 photos per property', 'warning');
      Swal.fire({ title: 'Processing photos…', allowOutsideClick: false, didOpen: () => Swal.showLoading() });
      try { let k = 0; for (const f of files) ED.items.push({ id: null, data: await compress(f), n: Date.now() + (k++), n0: null }) } catch { toast('One of the files is not a supported image', 'error') }
      Swal.close(); renderEdMedia();
    }
    const edDel = i => { const m = ED.items[i]; if (m.id) ED.removed.push(m.id); ED.items.splice(i, 1); renderEdMedia() };
    const edCover = i => { ED.items[i].n = ED.items[0].n - 1; renderEdMedia() };
    async function saveListing() {
      const g = id => $(id).value.trim(), num = id => g(id) === '' ? null : +g(id);
      if (!g('e_title')) return toast('Enter a title', 'error'); if (!(num('e_price') > 0)) return toast('Enter a price', 'error'); if (!g('e_loc')) return toast('Enter a location', 'error');
      Swal.fire({ title: 'Saving…', allowOutsideClick: false, didOpen: () => Swal.showLoading() });
      try {
        const lid = ED.id || doc(collection(fs, 'listings')).id; ED.items.sort((a, b) => a.n - b.n);
        const data = { title: g('e_title'), type: g('e_type'), purpose: g('e_purpose'), status: g('e_status'), price: num('e_price'), period: g('e_period'), location: g('e_loc'), address: g('e_addr'), beds: num('e_beds'), baths: num('e_baths'), size: num('e_size'), inspectionFee: num('e_fee'), payNow: num('e_pay') || 0, features: g('e_feat').split(/[,\n]/).map(x => x.trim()).filter(Boolean), desc: $('e_desc').value.trim(), videos: $('e_videos').value.split('\n').map(x => x.trim()).filter(Boolean), featured: $('e_featured').checked, cover: ED.items[0] ? await thumb(ED.items[0].data) : null, imgCount: ED.items.length, updatedAt: Date.now() };
        if (!ED.id) data.createdAt = Date.now();
        await setDoc(doc(fs, 'listings', lid), data, { merge: true });
        await Promise.all(ED.removed.map(mid => deleteDoc(doc(fs, 'listings', lid, 'media', mid))));
        for (const m of ED.items) {
          if (!m.id) await setDoc(doc(collection(fs, 'listings', lid, 'media')), { data: m.data, n: m.n });
          else if (m.n !== m.n0) await updateDoc(doc(fs, 'listings', lid, 'media', m.id), { n: m.n });
        }
        Swal.close(); closeModal(); toast(ED.id ? 'Property updated' : 'Property published'); ED = null;
      } catch (e) { Swal.close(); showErr('Saving property', e) }
    }
    function uploadVideo() {
      const { cloud, preset } = CFG.cloudinary, inp = document.createElement('input'); inp.type = 'file'; inp.accept = 'video/*';
      inp.onchange = async () => {
        const f = inp.files[0]; if (!f) return; if (f.size > 100 * 1024 * 1024) return toast('Video must be under 100MB', 'error');
        Swal.fire({ title: 'Uploading video…', text: 'Please keep this tab open.', allowOutsideClick: false, didOpen: () => Swal.showLoading() });
        try { const fd = new FormData(); fd.append('file', f); fd.append('upload_preset', preset); const r = await fetch(`https://api.cloudinary.com/v1_1/${cloud}/video/upload`, { method: 'POST', body: fd }), j = await r.json(); if (!j.secure_url) throw new Error(j.error?.message || 'Upload failed'); const ta = $('e_videos'); ta.value = (ta.value.trim() + '\n' + j.secure_url).trim(); Swal.close(); toast('Video uploaded') } catch (e) { Swal.close(); showErr('Video upload', e) }
      };
      inp.click();
    }

    // ===== admin: announcements =====
    function tAnns() {
      $('atab').innerHTML = `<div class="fx jb ac" style="margin-bottom:.8rem"><span class="muted small">${S.anns.length} announcement(s)</span><button class="btn" onclick="editAnn()">＋ New announcement</button></div><div class="anns">${S.anns.map(x => `<div class="ann" style="cursor:default">${x.image ? `<img src="${x.image}" alt="">` : ''}<div class="f1"><b>${x.pinned ? '📌 ' : ''}${esc(x.title)}</b><p class="muted small">${esc((x.body || '').slice(0, 90))}</p><span class="small muted">${dstr(x.createdAt)}</span><div class="fx g3" style="margin-top:.3rem"><button class="lnk" onclick="editAnn('${x.id}')">Edit</button><button class="lnk bad" onclick="delAnn('${x.id}')">Delete</button></div></div></div>`).join('') || '<p class="muted">No announcements yet.</p>'}</div>`;
    }
    function editAnn(id) {
      const x = id ? S.anns.find(a => a.id === id) : { title: '', body: '', video: '', pinned: false, image: null }; AE = { id: id || null, image: x.image || null };
      openModal(`<h2>${id ? 'Edit' : 'New'} announcement</h2><label class="lbl">Title</label><input id="a_title" class="inp" value="${esc(x.title)}"><label class="lbl">Message</label><textarea id="a_body" class="inp" rows="5">${esc(x.body)}</textarea><label class="lbl">Video link (optional)</label><input id="a_video" class="inp" value="${esc(x.video || '')}" placeholder="YouTube or .mp4 link"><label class="lbl">Image (optional)</label><div id="a_prev"></div><input type="file" accept="image/*" onchange="annImg(this)"><p style="margin:.7rem 0"><label><input id="a_pin" type="checkbox" ${x.pinned ? 'checked' : ''}> 📌 Pin to the top</label></p><button class="btn w100" onclick="saveAnn()">${id ? 'Save changes' : 'Publish'}</button>`);
      annPrev();
    }
    const annPrev = () => { const el = $('a_prev'); if (el) el.innerHTML = AE?.image ? `<div class="fx ac g3" style="margin-bottom:.4rem"><img src="${AE.image}" style="width:90px;border-radius:.5rem"><button class="lnk bad" onclick="annRm()">Remove image</button></div>` : '' };
    const annRm = () => { AE.image = null; annPrev() };
    async function annImg(inp) { const f = inp.files[0]; if (!f) return; try { AE.image = await compress(f, 900); annPrev() } catch { toast('Unsupported image', 'error') } }
    async function saveAnn() {
      const t = $('a_title').value.trim(), b = $('a_body').value.trim(); if (!t || !b) return toast('Add a title and a message', 'error');
      try { const id = AE.id || doc(collection(fs, 'announcements')).id, d = { title: t, body: b, video: $('a_video').value.trim(), pinned: $('a_pin').checked, image: AE.image || null, updatedAt: Date.now() }; if (!AE.id) d.createdAt = Date.now(); await setDoc(doc(fs, 'announcements', id), d, { merge: true }); closeModal(); toast('Announcement saved') } catch (e) { showErr('Saving announcement', e) }
    }
    async function delAnn(id) { const r = await Swal.fire({ title: 'Delete announcement?', icon: 'warning', showCancelButton: true, confirmButtonText: 'Delete' }); if (r.isConfirmed) deleteDoc(doc(fs, 'announcements', id)).then(() => toast('Deleted', 'info')).catch(e => showErr('Deleting', e)) }

    // ===== admin: settings =====
    function tSettings() {
      const s = S.settings;
      $('atab').innerHTML = `<div class="narrow"><label class="lbl">Business name</label><input id="s_brand" class="inp" value="${esc(s.brand || CFG.brand)}"><label class="lbl">Headline on the home page</label><input id="s_tag" class="inp" value="${esc(s.tagline || '')}" placeholder="Find your next home, shop or office"><label class="lbl">Phone / WhatsApp number</label><input id="s_phone" class="inp" value="${esc(s.phone || '')}" placeholder="0803 000 0000"><label class="lbl">Office address</label><input id="s_addr" class="inp" value="${esc(s.address || '')}"><label class="lbl">Default inspection fee (₦, 0 = free)</label><input id="s_fee" class="inp" type="number" min="0" value="${esc(s.defaultFee ?? 0)}"><button class="btn" onclick="saveSettings()">Save settings</button></div>`;
    }
    async function saveSettings() {
      try { await setDoc(doc(fs, 'settings', 'site'), { brand: $('s_brand').value.trim() || CFG.brand, tagline: $('s_tag').value.trim(), phone: $('s_phone').value.trim(), address: $('s_addr').value.trim(), defaultFee: +$('s_fee').value || 0 }, { merge: true }); toast('Settings saved') } catch (e) { showErr('Saving settings', e) }
    }

    window.addEventListener('unhandledrejection', e => { const m = String(e.reason?.message || ''); if (m && !/Config missing/.test(m)) showErr('Something went wrong', e.reason) });
    window.addEventListener('hashchange', () => { if (location.hash.startsWith('#l=')) openListing(location.hash.slice(3)) });
    Object.assign(window, { toggleTheme, closeModal, go, openAuth, authGo, googleGo, resetPw, profile, setF, openListing, openAnn, toggleSave, galGo, galSet, shareL, askAdmin, bookInspection, startDeal, sendChat, setTab, setReqStatus, toggleVerify, delReq, setRF, uq_set, openUser, msgUser, pickThread, setLStatus, delListing, editListing, edAdd, edDel, edCover, saveListing, uploadVideo, editAnn, annImg, annRm, saveAnn, delAnn, saveSettings });
    startPublic();
  </script>
</body>

</html>
