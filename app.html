<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f6f4ef">
  <meta name="description"
    content="Houses, apartments, shops and offices for sale and to let / lease. Book inspections and pay securely online.">
  <title>Empire Inc | Houses, Shops, Offices &amp; Leases</title>
  <link rel="icon"
    href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8F%A1%3C/text%3E%3C/svg%3E">
  <script>
    (function () {
      var t = null; try { t = localStorage.getItem('estate-theme') } catch (e) { }
      if (t !== 'light' && t !== 'dark') t = (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
      document.documentElement.setAttribute('data-theme', t); document.documentElement.classList.add('js')
    })();
  </script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11.12.4/dist/sweetalert2.all.min.js"></script>
  <script src="https://js.paystack.co/v1/inline.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;600;700;800&family=Manrope:wght@400;500;600;700;800&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --bg: #f6f4ef;
      --bg2: #ece8de;
      --panel: #fff;
      --panel2: #f3f0e9;
      --fg: #101c26;
      --muted: #5b6977;
      --line: rgba(16, 28, 38, .12);
      --accent: #0b3a53;
      --accent2: #14577d;
      --on: #fff;
      --gold: #c8962e;
      --ok: #15803d;
      --bad: #b91c1c;
      --warn: #b45309;
      --r: .85rem;
      --rl: 1.25rem;
      --ease: cubic-bezier(.22, .8, .3, 1);
      --sh1: 0 1px 2px rgba(16, 28, 38, .06), 0 2px 8px rgba(16, 28, 38, .06);
      --sh2: 0 14px 34px rgba(16, 28, 38, .18);
      color-scheme: light
    }

    :root[data-theme=dark] {
      --bg: #0b1620;
      --bg2: #0f1d29;
      --panel: #132330;
      --panel2: #1a2f3e;
      --fg: #eef2f5;
      --muted: #93a4b1;
      --line: rgba(255, 255, 255, .12);
      --accent: #d9a93f;
      --accent2: #e8bd5c;
      --on: #1a1200;
      --gold: #d9a93f;
      --ok: #4ade80;
      --bad: #f87171;
      --warn: #fbbf24;
      --sh1: 0 1px 2px rgba(0, 0, 0, .3), 0 2px 8px rgba(0, 0, 0, .25);
      --sh2: 0 14px 34px rgba(0, 0, 0, .5);
      color-scheme: dark
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0
    }

    html {
      scroll-behavior: smooth;
      -webkit-text-size-adjust: 100%
    }

    body {
      background: var(--bg);
      color: var(--fg);
      font-family: 'Manrope', system-ui, -apple-system, sans-serif;
      font-size: 15px;
      line-height: 1.55;
      min-height: 100dvh;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px);
      -webkit-font-smoothing: antialiased
    }

    h1,
    h2,
    h3 {
      font-family: 'Fraunces', Georgia, serif;
      font-weight: 600;
      line-height: 1.1;
      letter-spacing: -.02em;
      font-optical-sizing: auto
    }

    h2 {
      font-size: clamp(1.45rem, 3vw, 1.9rem);
      margin-bottom: .9rem
    }

    h3 {
      font-size: 1.15rem
    }

    button {
      font: inherit;
      color: inherit;
      background: none;
      border: 0;
      cursor: pointer
    }

    a {
      color: var(--accent);
      cursor: pointer;
      text-decoration: none
    }

    img {
      max-width: 100%;
      display: block
    }

    :focus-visible {
      outline: 2px solid var(--gold);
      outline-offset: 2px;
      border-radius: .4rem
    }

    ::selection {
      background: var(--gold);
      color: #1a1200
    }

    .wrap {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 1.25rem
    }

    .narrow {
      max-width: 780px
    }

    .fx {
      display: flex
    }

    .ac {
      align-items: center
    }

    .jb {
      justify-content: space-between
    }

    .jc {
      justify-content: center
    }

    .fw {
      flex-wrap: wrap
    }

    .g2 {
      gap: .5rem
    }

    .g3 {
      gap: .9rem
    }

    .f1 {
      flex: 1;
      min-width: 0
    }

    .tr {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap
    }

    .muted {
      color: var(--muted)
    }

    .small {
      font-size: .82rem
    }

    .center {
      text-align: center
    }

    .bad {
      color: var(--bad)
    }

    .ok {
      color: var(--ok)
    }

    .w100 {
      width: 100%
    }

    .sec {
      padding: 2.2rem 0 .6rem
    }

    .sech {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 1rem;
      margin-bottom: 1rem
    }

    .sech h2 {
      margin: 0
    }

    .inp,
    select,
    textarea {
      width: 100%;
      padding: .7rem .9rem;
      border-radius: var(--r);
      background: var(--panel);
      color: var(--fg);
      border: 1px solid var(--line);
      font: inherit;
      margin-bottom: .7rem;
      transition: border-color .2s, box-shadow .2s
    }

    textarea {
      resize: vertical
    }

    .inp:hover,
    select:hover,
    textarea:hover {
      border-color: color-mix(in srgb, var(--accent) 40%, var(--line))
    }

    .inp:focus,
    select:focus,
    textarea:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 22%, transparent)
    }

    .lbl {
      display: block;
      font-size: .72rem;
      font-weight: 700;
      margin: .25rem 0 .3rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: .06em
    }

    input[type=checkbox] {
      accent-color: var(--accent);
      width: 1rem;
      height: 1rem;
      vertical-align: -2px;
      margin-right: .3rem
    }

    .btn,
    .btn2 {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: .4rem;
      padding: .68rem 1.25rem;
      border-radius: var(--r);
      font-weight: 700;
      line-height: 1.2;
      transition: transform .18s var(--ease), box-shadow .2s, background .2s, filter .2s;
      position: relative;
      overflow: hidden
    }

    .btn {
      background: var(--accent);
      color: var(--on);
      box-shadow: var(--sh1)
    }

    .btn.gold {
      background: linear-gradient(135deg, #d8a73a, #b9851f);
      color: #1a1200
    }

    .btn2 {
      border: 1px solid var(--line);
      background: var(--panel);
      font-weight: 500
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: var(--sh2);
      filter: brightness(1.08)
    }

    .btn2:hover {
      background: var(--panel2);
      transform: translateY(-1px)
    }

    .btn:active,
    .btn2:active {
      transform: scale(.97)
    }

    .btn:disabled {
      opacity: .5;
      cursor: not-allowed;
      transform: none
    }

    .lnk {
      font-size: .82rem;
      text-decoration: underline;
      text-underline-offset: 3px;
      color: var(--accent)
    }

    .ib {
      position: relative;
      width: 2.4rem;
      height: 2.4rem;
      border-radius: 9999px;
      border: 1px solid var(--line);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: var(--panel);
      transition: transform .2s var(--ease), background .2s
    }

    .ib:hover {
      background: var(--panel2);
      transform: rotate(-8deg) scale(1.06)
    }

    .ib svg {
      width: 18px;
      height: 18px
    }

    .cnt {
      position: absolute;
      top: -.25rem;
      right: -.25rem;
      min-width: 1.1rem;
      height: 1.1rem;
      padding: 0 .25rem;
      border-radius: 9999px;
      background: var(--bad);
      color: #fff;
      font-size: .68rem;
      font-style: normal;
      display: flex;
      align-items: center;
      justify-content: center
    }

    .ib.ring {
      animation: ring 2.6s ease-in-out infinite
    }

    #bar {
      display: none;
      align-items: center;
      justify-content: center;
      gap: .8rem;
      padding: .45rem 2.4rem .45rem 1rem;
      background: linear-gradient(90deg, var(--accent), var(--accent2));
      color: var(--on);
      font-size: .82rem;
      position: relative;
      animation: slideDown .5s var(--ease)
    }

    #bar span {
      cursor: pointer;
      text-align: center;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap
    }

    #bar button {
      position: absolute;
      right: .8rem;
      color: inherit;
      opacity: .8
    }

    #top {
      position: sticky;
      top: 0;
      z-index: 50;
      background: color-mix(in srgb, var(--panel) 90%, transparent);
      backdrop-filter: blur(12px) saturate(1.4);
      border-bottom: 1px solid var(--line);
      transition: box-shadow .3s, padding .3s
    }

    #top.sc {
      box-shadow: var(--sh1)
    }

    .hd {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      padding-top: .7rem;
      padding-bottom: .7rem;
      transition: padding .3s
    }

    #top.sc .hd {
      padding-top: .45rem;
      padding-bottom: .45rem
    }

    .brand {
      display: flex;
      align-items: center;
      gap: .55rem;
      font-family: 'Fraunces', serif;
      font-size: 1.4rem;
      color: var(--fg);
      white-space: nowrap
    }

    .logo {
      width: 2.1rem;
      height: 2.1rem;
      border-radius: .6rem;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      color: var(--on);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: transform .4s var(--ease)
    }

    .brand:hover .logo {
      transform: rotate(-10deg) scale(1.08)
    }

    .logo svg {
      width: 1.2rem;
      height: 1.2rem
    }

    .nav {
      display: flex;
      gap: .2rem;
      overflow-x: auto;
      scrollbar-width: none
    }

    .nav::-webkit-scrollbar {
      display: none
    }

    .nav button {
      padding: .48rem .9rem;
      border-radius: 9999px;
      font-weight: 500;
      white-space: nowrap;
      position: relative;
      transition: background .2s, color .2s
    }

    .nav button:hover {
      background: var(--panel2)
    }

    .nav button.on {
      background: var(--accent);
      color: var(--on)
    }

    .dotb {
      position: absolute;
      top: .3rem;
      right: .35rem;
      width: .5rem;
      height: .5rem;
      border-radius: 9999px;
      background: var(--bad);
      animation: pulse 1.8s infinite
    }

    .hact {
      display: flex;
      align-items: center;
      gap: .5rem
    }

    .avt {
      width: 2.4rem;
      height: 2.4rem;
      border-radius: 9999px;
      background: linear-gradient(135deg, #d8a73a, #b9851f);
      color: #1a1200;
      font-weight: 700;
      transition: transform .2s var(--ease)
    }

    .avt:hover {
      transform: scale(1.08)
    }

    .hero {
      position: relative;
      overflow: hidden;
      padding: clamp(3rem, 8vw, 5.5rem) 0 clamp(2rem, 5vw, 3rem);
      background: linear-gradient(160deg, color-mix(in srgb, var(--accent) 16%, var(--bg)), var(--bg) 70%)
    }

    .blob {
      position: absolute;
      border-radius: 50%;
      filter: blur(60px);
      opacity: .5;
      pointer-events: none
    }

    .b1 {
      width: 340px;
      height: 340px;
      background: var(--gold);
      top: -120px;
      right: -60px;
      animation: float 11s ease-in-out infinite
    }

    .b2 {
      width: 300px;
      height: 300px;
      background: var(--accent2);
      bottom: -140px;
      left: -80px;
      opacity: .3;
      animation: float 14s ease-in-out infinite reverse
    }

    .hero .wrap {
      position: relative
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: .4rem;
      text-transform: uppercase;
      letter-spacing: .16em;
      font-size: .72rem;
      font-weight: 700;
      color: var(--gold);
      animation: fadeUp .7s var(--ease) both
    }

    .hero h1 {
      font-size: clamp(2.2rem, 6vw, 4rem);
      max-width: 17ch;
      margin: .6rem 0 .8rem;
      animation: fadeUp .7s .08s var(--ease) both
    }

    .hero p.lead {
      max-width: 54ch;
      color: var(--muted);
      font-size: 1.05rem;
      animation: fadeUp .7s .16s var(--ease) both
    }

    .hstats {
      display: flex;
      gap: 2rem;
      margin: 1.4rem 0 0;
      flex-wrap: wrap;
      animation: fadeUp .7s .24s var(--ease) both
    }

    .hstats b {
      display: block;
      font-family: 'Fraunces', serif;
      font-size: 2rem;
      font-weight: 400;
      line-height: 1
    }

    .hstats span {
      font-size: .8rem;
      color: var(--muted)
    }

    .fbar {
      display: grid;
      gap: .6rem;
      grid-template-columns: auto 1fr 1.4fr 1fr auto;
      margin-top: 1.6rem;
      align-items: start;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--rl);
      padding: .8rem;
      box-shadow: var(--sh2);
      animation: fadeUp .7s .32s var(--ease) both
    }

    .fbar select,
    .fbar .inp {
      margin: 0
    }

    .seg {
      display: flex;
      border: 1px solid var(--line);
      border-radius: var(--r);
      overflow: hidden;
      height: 2.7rem
    }

    .seg button {
      padding: 0 1.1rem;
      font-weight: 500;
      transition: background .2s, color .2s
    }

    .seg button:hover {
      background: var(--panel2)
    }

    .seg button.on {
      background: var(--accent);
      color: var(--on)
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(275px, 1fr));
      gap: 1.25rem
    }

    .lcard {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--rl);
      overflow: hidden;
      cursor: pointer;
      box-shadow: var(--sh1);
      transition: transform .3s var(--ease), box-shadow .3s var(--ease)
    }

    .lcard.an {
      animation: cardIn .6s var(--ease) both;
      animation-delay: calc(var(--i)*55ms)
    }

    .lcard:hover {
      transform: translateY(-6px);
      box-shadow: var(--sh2)
    }

    .ph {
      position: relative;
      aspect-ratio: 4/3;
      background: var(--panel2);
      overflow: hidden
    }

    .ph img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform .7s var(--ease)
    }

    .lcard:hover .ph img {
      transform: scale(1.07)
    }

    .ph::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(0, 0, 0, .25), transparent 35%, transparent 65%, rgba(0, 0, 0, .35));
      pointer-events: none
    }

    .noimg {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 3rem
    }

    .tags {
      position: absolute;
      left: .7rem;
      top: .7rem;
      display: flex;
      gap: .35rem;
      z-index: 2
    }

    .tag {
      font-size: .7rem;
      font-weight: 700;
      padding: .22rem .65rem;
      border-radius: 9999px;
      background: var(--accent);
      color: var(--on)
    }

    .tag.rent {
      background: var(--gold);
      color: #1a1200
    }

    .tag.new {
      background: #16a34a;
      color: #fff;
      animation: pulse 2s infinite
    }

    .st {
      position: absolute;
      left: .7rem;
      bottom: .7rem;
      z-index: 2;
      font-size: .72rem;
      font-weight: 700;
      padding: .25rem .7rem;
      border-radius: 9999px;
      background: var(--bad);
      color: #fff
    }

    .st.rented {
      background: var(--warn)
    }

    .feat {
      position: absolute;
      right: .7rem;
      bottom: .7rem;
      z-index: 2;
      font-size: .7rem;
      font-weight: 700;
      padding: .25rem .65rem;
      border-radius: 9999px;
      background: rgba(0, 0, 0, .7);
      color: #ffd36b
    }

    .pa {
      position: absolute;
      right: .7rem;
      top: .7rem;
      z-index: 2;
      display: flex;
      flex-direction: column;
      gap: .4rem
    }

    .pa button {
      width: 2.1rem;
      height: 2.1rem;
      border-radius: 9999px;
      background: rgba(255, 255, 255, .94);
      color: #14202b;
      font-size: 1.05rem;
      box-shadow: 0 2px 8px rgba(0, 0, 0, .2);
      transition: transform .2s var(--ease)
    }

    .pa button:hover {
      transform: scale(1.12)
    }

    .heart.on {
      background: #b91c1c;
      color: #fff;
      animation: pop .45s var(--ease)
    }

    .cmpb.on {
      background: var(--accent);
      color: var(--on)
    }

    .lb {
      padding: 1rem 1.1rem 1.15rem
    }

    .price {
      font-weight: 700;
      font-size: 1.25rem;
      color: var(--accent)
    }

    .price small {
      font-weight: 400;
      color: var(--muted);
      font-size: .8rem
    }

    .lb h3 {
      font-family: 'Manrope', sans-serif;
      font-weight: 700;
      font-size: 1rem;
      margin: .15rem 0
    }

    .meta {
      margin-top: .5rem;
      padding-top: .5rem;
      border-top: 1px dashed var(--line);
      font-size: .8rem;
      color: var(--muted)
    }

    .skel {
      border-radius: var(--rl);
      height: 330px;
      background: linear-gradient(100deg, var(--panel2) 30%, var(--panel) 50%, var(--panel2) 70%);
      background-size: 300% 100%;
      animation: shimmer 1.4s infinite linear;
      border: 1px solid var(--line)
    }

    .row {
      display: flex;
      gap: 1.1rem;
      overflow-x: auto;
      scroll-snap-type: x mandatory;
      padding: .3rem .2rem 1rem;
      scrollbar-width: none
    }

    .row::-webkit-scrollbar {
      display: none
    }

    .row .lcard {
      flex: 0 0 min(300px, 80%);
      scroll-snap-align: start
    }

    .arrows {
      display: flex;
      gap: .4rem
    }

    .anns {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: .9rem
    }

    .ann {
      display: flex;
      gap: .9rem;
      padding: .9rem;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--rl);
      cursor: pointer;
      box-shadow: var(--sh1);
      transition: transform .25s var(--ease), box-shadow .25s
    }

    .ann:hover {
      transform: translateY(-3px);
      box-shadow: var(--sh2)
    }

    .ann.pin {
      border-color: var(--gold)
    }

    .ann img {
      width: 76px;
      height: 76px;
      object-fit: cover;
      border-radius: .7rem;
      flex: none
    }

    .why {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
      gap: 1rem
    }

    .why div {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--rl);
      padding: 1.3rem;
      box-shadow: var(--sh1);
      transition: transform .3s var(--ease)
    }

    .why div:hover {
      transform: translateY(-4px)
    }

    .why i {
      font-style: normal;
      font-size: 1.7rem;
      display: block;
      margin-bottom: .5rem
    }

    .why b {
      display: block;
      margin-bottom: .2rem
    }

    .steps {
      counter-reset: s;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 1rem
    }

    .steps div {
      counter-increment: s;
      position: relative;
      padding: 1.2rem 1.2rem 1.2rem 3.6rem;
      background: var(--panel2);
      border-radius: var(--rl)
    }

    .steps div::before {
      content: counter(s);
      position: absolute;
      left: 1rem;
      top: 1.1rem;
      width: 1.9rem;
      height: 1.9rem;
      border-radius: 9999px;
      background: var(--accent);
      color: var(--on);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700
    }

    .js .rv {
      opacity: 0;
      transform: translateY(22px);
      transition: opacity .7s var(--ease), transform .7s var(--ease)
    }

    .js .rv.in {
      opacity: 1;
      transform: none
    }

      font-size: 2rem;
      line-height: 1;
      min-width: 3.4rem;
      text-align: center
    }

    .nxt small {
      display: block;
      opacity: .75;
      font-size: .72rem;
      font-family: 'Manrope', sans-serif
    }

    .dstats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: .9rem;
      margin: 1.1rem 0
    }

    .dstat {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--rl);
      padding: 1rem 1.1rem;
      box-shadow: var(--sh1);
      cursor: pointer;
      position: relative;
      overflow: hidden;
      transition: transform .3s var(--ease), box-shadow .3s
    }

    .dstat:hover {
      transform: translateY(-4px);
      box-shadow: var(--sh2)
    }

    .dstat i {
      font-style: normal;
      font-size: 1.3rem;
      display: block;
      margin-bottom: .35rem
    }

    .dstat b {
      display: block;
      font-family: 'Fraunces', serif;
      font-size: 1.8rem;
      font-weight: 400;
      line-height: 1.1
    }

    .dstat span {
      font-size: .78rem;
      color: var(--muted)
    }

    .dstat::after {
      content: '';
      position: absolute;
      left: 0;
      bottom: 0;
      height: 3px;
      width: 100%;
      background: linear-gradient(90deg, var(--gold), var(--accent), var(--gold));
      background-size: 200% 100%;
      animation: sweep 3s linear infinite;
      opacity: .7
    }

    .qa {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(110px, 1fr));
      gap: .7rem;
      margin-bottom: 1.2rem
    }

    .qa button {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: .3rem;
      padding: .9rem .5rem;
      border-radius: var(--rl);
      background: var(--panel2);
      font-weight: 500;
      font-size: .85rem;
      transition: transform .25s var(--ease), background .2s
    }

    .qa button:hover {
      transform: translateY(-3px);
      background: var(--panel)
    }

    .qa b {
      font-size: 1.4rem;
      font-weight: 400
    }

    .dcols {
      display: grid;
      grid-template-columns: 1.5fr 1fr;
      gap: 1.1rem;
      align-items: start
    }

    .chipf {
      display: flex;
      gap: .4rem;
      overflow-x: auto;
      scrollbar-width: none;
      margin-bottom: .8rem
    }

    .chipf::-webkit-scrollbar {
      display: none
    }

    .chipf button {
      padding: .35rem .9rem;
      border-radius: 9999px;
      border: 1px solid var(--line);
      font-size: .82rem;
      white-space: nowrap;
      background: var(--panel);
      transition: background .2s, color .2s
    }

    .chipf button.on {
      background: var(--accent);
      color: var(--on);
      border-color: transparent
    }

    .act {
      display: flex;
      gap: .9rem;
      padding: .9rem;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--rl);
      box-shadow: var(--sh1);
      margin-bottom: .7rem;
      transition: transform .25s var(--ease), box-shadow .25s
    }

    .act:hover {
      transform: translateX(4px);
      box-shadow: var(--sh2)
    }

    .act img,
    .act .th {
      width: 84px;
      height: 84px;
      border-radius: .8rem;
      object-fit: cover;
      flex: none;
      cursor: pointer
    }

    .prog {
      display: flex;
      align-items: center;
      gap: .3rem;
      margin: .4rem 0
    }

    .prog i {
      flex: 1;
      height: 5px;
      border-radius: 9999px;
      background: var(--line);
      transition: background .4s
    }

    .prog i.on {
      background: var(--ok)
    }

    .prog span {
      font-size: .72rem;
      font-weight: 700;
      text-transform: capitalize;
      margin-left: .3rem;
      color: var(--muted)
    }

    .prog.x span {
      color: var(--bad);
      margin: 0
    }

    .side .panel {
      margin-bottom: 1rem
    }

    .mrow {
      display: flex;
      gap: .7rem;
      align-items: center;
      padding: .5rem 0;
      border-bottom: 1px solid var(--line);
      cursor: pointer
    }

    .mrow:last-child {
      border: 0
    }

    .mrow img {
      width: 54px;
      height: 44px;
      border-radius: .5rem;
      object-fit: cover
    }

    .empty {
      text-align: center;
      padding: 2rem 1rem;
      color: var(--muted)
    }

    .empty b {
      display: block;
      font-size: 2.2rem;
      margin-bottom: .3rem
    }

    #dock {
      display: none;
      position: fixed;
      left: .7rem;
      right: .7rem;
      bottom: calc(.6rem + env(safe-area-inset-bottom, 0px));
      z-index: 58;
      background: color-mix(in srgb, var(--panel) 88%, transparent);
      backdrop-filter: blur(16px) saturate(1.5);
      border: 1px solid var(--line);
      border-radius: 1.4rem;
      box-shadow: var(--sh2);
      padding: .35rem;
      justify-content: space-around;
      animation: cardIn .5s var(--ease)
    }

    #dock button {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: .05rem;
      padding: .4rem 0;
      border-radius: 1rem;
      font-size: .68rem;
      font-weight: 500;
      color: var(--muted);
      position: relative;
      transition: background .25s, color .25s, transform .2s var(--ease)
    }

    #dock button b {
      font-size: 1.2rem;
      font-weight: 400;
      line-height: 1.2
    }

    #dock button.on {
      background: var(--accent);
      color: var(--on);
      transform: translateY(-2px)
    }

    #dock .dotb {
      top: .2rem;
      right: 32%
    }

    @keyframes sweep {
      from {
        background-position: 0 0
      }

      to {
        background-position: 200% 0
      }
    }

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(18px)
      }

      to {
        opacity: 1;
        transform: none
      }
    }

    @keyframes fadeIn {
      from {
        opacity: 0
      }

      to {
        opacity: 1
      }
    }

    @keyframes cardIn {
      from {
        opacity: 0;
        transform: translateY(26px) scale(.97)
      }

      to {
        opacity: 1;
        transform: none
      }
    }

    @keyframes modalIn {
      from {
        opacity: 0;
        transform: translateY(30px) scale(.96)
      }

      to {
        opacity: 1;
        transform: none
      }
    }

    @keyframes slideDown {
      from {
        opacity: 0;
        transform: translateY(-100%)
      }

      to {
        opacity: 1;
        transform: none
      }
    }

    @keyframes pop {
      0% {
        transform: scale(.6)
      }

      60% {
        transform: scale(1.18)
      }

      100% {
        transform: scale(1)
      }
    }

    @keyframes shimmer {
      to {
        background-position: -300% 0
      }
    }

    @keyframes float {

      0%,
      100% {
        transform: translate(0, 0)
      }

      50% {
        transform: translate(30px, 24px)
      }
    }

    @keyframes pulse {

      0%,
      100% {
        opacity: 1;
        transform: scale(1)
      }

      50% {
        opacity: .65;
        transform: scale(1.12)
      }
    }

    @keyframes ring {

      0%,
      86%,
      100% {
        transform: rotate(0)
      }

      90% {
        transform: rotate(14deg)
      }

      94% {
        transform: rotate(-12deg)
      }

      98% {
        transform: rotate(8deg)
      }
    }

    @keyframes grow {
      from {
        transform: scaleY(0)
      }

      to {
        transform: scaleY(1)
      }
    }

    @keyframes fall {
      to {
        transform: translateY(110vh) rotate(720deg);
        opacity: .9
      }
    }

    @media(max-width:900px) {
      .fbar {
        grid-template-columns: 1fr 1fr
      }

      .seg {
        grid-column: 1/-1
      }

      .fbar .inp {
        grid-column: 1/-1
      }

      .det,
      .two,
      .frm,
      .cols,
      .fcols,
      .dcols {
        grid-template-columns: 1fr
      }

      .cg {
        grid-template-columns: 1fr 1fr 1fr
      }

      .hstats {
        gap: 1.2rem
      }

      #dock {
        display: flex
      }

      body {
        padding-bottom: calc(5rem + env(safe-area-inset-bottom, 0px))
      }

      #cmpbar {
        bottom: 5.4rem
      }

      #totop {
        bottom: 5.6rem
      }

      .nav {
        display: none
      }

      .hd {
        flex-wrap: nowrap
      }
    }

    @media(prefers-reduced-motion:reduce) {

      *,
      *::before,
      *::after {
        animation: none !important;
        transition: none !important;
        scroll-behavior: auto !important
      }

      .js .rv {
        opacity: 1;
        transform: none
      }
    }

    /* ===== v3: ambient background, cursor, spotlight, admin console ===== */
    #bgc {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: none
    }

    #top,
    main,
    footer,
    #bar {
      position: relative;
      z-index: 1
    }

    #top {
      position: sticky
    }

    .hero {
      background: linear-gradient(160deg, color-mix(in srgb, var(--accent) 12%, transparent), transparent 75%)
    }

    .lcard,
    .dstat,
    .stat,
    .kpi,
    .panel,
    .act,
    .why div,
    .ann {
      position: relative
    }

    .lcard::before,
    .dstat::before,
    .stat::before,
    .kpi::before,
    .panel::before,
    .act::before,
    .why div::before,
    .ann::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: inherit;
      background: radial-gradient(260px circle at var(--mx, 50%) var(--my, 50%), color-mix(in srgb, var(--gold) 20%, transparent), transparent 62%);
      opacity: 0;
      transition: opacity .35s;
      pointer-events: none;
      z-index: 1
    }

    .lcard:hover::before,
    .dstat:hover::before,
    .stat:hover::before,
    .kpi:hover::before,
    .panel:hover::before,
    .act:hover::before,
    .why div:hover::before,
    .ann:hover::before {
      opacity: 1
    }

    #cur,
    #ring {
      position: fixed;
      left: 0;
      top: 0;
      pointer-events: none;
      z-index: 99999;
      display: none;
      border-radius: 50%
    }

    #cur {
      width: 8px;
      height: 8px;
      margin: -4px;
      background: var(--gold)
    }

    #ring {
      width: 38px;
      height: 38px;
      margin: -19px;
      border: 1.5px solid var(--gold);
      transition: width .25s var(--ease), height .25s var(--ease), margin .25s var(--ease), background .25s, opacity .3s
    }

    #ring.h {
      width: 62px;
      height: 62px;
      margin: -31px;
      background: color-mix(in srgb, var(--gold) 14%, transparent)
    }

    #ring.d {
      width: 26px;
      height: 26px;
      margin: -13px;
      background: color-mix(in srgb, var(--gold) 30%, transparent)
    }

    body.fp #cur,
    body.fp #ring {
      display: block
    }

    .rip {
      position: fixed;
      width: 10px;
      height: 10px;
      margin: -5px;
      border-radius: 50%;
      border: 2px solid var(--gold);
      pointer-events: none;
      z-index: 99998;
      animation: rip .6s ease-out forwards
    }

    @keyframes rip {
      to {
        transform: scale(7);
        opacity: 0
      }
    }

    .heroword {
      display: inline-block;
      animation: fadeUp .8s var(--ease) both
    }

    /* admin console */
    .adm {
      display: grid;
      grid-template-columns: 232px 1fr;
      gap: 1.2rem;
      align-items: start
    }

    .anav {
      position: sticky;
      top: 5rem;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--rl);
      padding: .6rem;
      display: flex;
      flex-direction: column;
      gap: .15rem;
      box-shadow: var(--sh1)
    }

    .anav .who {
      display: flex;
      align-items: center;
      gap: .6rem;
      padding: .6rem .6rem .8rem;
      border-bottom: 1px solid var(--line);
      margin-bottom: .4rem
    }

    .anav .who .avt {
      width: 2.4rem;
      height: 2.4rem;
      flex: none;
      cursor: default
    }

    .anav button {
      display: flex;
      align-items: center;
      gap: .6rem;
      padding: .62rem .8rem;
      border-radius: .8rem;
      text-align: left;

      transition: background .2s, color .2s, transform .2s var(--ease)
    }

    .anav button:hover {
      background: var(--panel2);
      transform: translateX(3px)
    }

    .anav button.on {
      background: var(--accent);
      color: var(--on)
    }

    .anav button span.i {
      width: 1.4rem;
      text-align: center
    }

    .anav .dot {
      margin-left: auto
    }

    .kpis {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
      gap: .9rem;
      margin-bottom: 1.1rem
    }

    .kpi {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--rl);
      padding: 1.1rem;
      box-shadow: var(--sh1);
      overflow: hidden;
      transition: transform .3s var(--ease), box-shadow .3s
    }

    .kpi:hover {
      transform: translateY(-4px);
      box-shadow: var(--sh2)
    }

    .kpi .ic {

      height: 2.4rem;

    .kpi b {

      font-size: 1.8rem;

    .kpi span {
      font-size: .78rem;
      color: var(--muted)
    }

    .chip {
      display: inline-block;
      margin-left: .4rem;
      padding: .05rem .5rem;
      border-radius: 9999px;
      font-size: .68rem;
      font-weight: 700;
      background: color-mix(in srgb, var(--ok) 18%, transparent);
      color: var(--ok)

    .chip.dn {
      background: color-mix(in srgb, var(--bad) 18%, transparent);
      color: var(--bad)
    }

    .alrts {
      display: flex;
      gap: .6rem;
      flex-wrap: wrap;
      margin-bottom: 1.1rem
    }

    .alrt {
      display: flex;
      align-items: center;
      gap: .5rem;
      padding: .55rem .9rem;
      border-radius: 9999px;
      background: color-mix(in srgb, var(--warn) 16%, var(--panel));
      border: 1px solid color-mix(in srgb, var(--warn) 40%, transparent);
      font-size: .82rem;
      font-weight: 500;
      transition: transform .2s var(--ease)
    }

    .alrt:hover {

    }

    .g3c {
      display: grid;
      grid-template-columns: 1.4fr 1fr 1fr;
      gap: 1rem;
      margin-bottom: 1.1rem
    }

    .g2c {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
      margin-bottom: 1.1rem
    }

    .donutw {
      display: flex;
      gap: 1rem;
      align-items: center;
      margin-top: .8rem;
      flex-wrap: wrap
    }

      height: .6rem;

    }

    .hb .l {

      justify-content: space-between;
      font-size: .8rem;
      gap: .5rem
    }

    .hb .bar {

    }

    .hb .bar i {
      display: block;

    }

    @keyframes growx {

        transform: scaleX(0)
      }

      to {
        transform: scaleX(1)
      }
    }

    .chart.rev i {
      background: linear-gradient(180deg, var(--ok), var(--accent2))
    }

    @media(max-width:900px) {
      .adm {
        grid-template-columns: 1fr
      }

      .anav {

      }

      }

      }

    }

    }

    /* ===== v4: typography, fixed header, construction scene ===== */
    body {
      font-family: 'Manrope', system-ui, -apple-system, sans-serif;
      letter-spacing: -.005em
    }

    h1,
    h2,
    h3,
    .brand {
      font-family: 'Fraunces', Georgia, serif;
      text-wrap: balance
    }

    .btn2,
    .nav button,
    .anav button,
    .chipf button,
    .tabs button,
    .fbar2 button,
    .seg button {
      font-weight: 600
    }

    .stat b,
    .kpi b,
    .dstat b,
    .hstats b,
    .nxt .big,
    .donut::after {
      font-weight: 600
    }

    .price {
      font-weight: 800;
      letter-spacing: -.01em
    }

    .eyebrow {
      letter-spacing: .2em
    }

    .lb h3 {
      font-family: 'Manrope', sans-serif;
      font-weight: 800;
      letter-spacing: -.01em
    }

    .hero h1 {
      font-weight: 700;
      font-size: clamp(2.3rem, 5.2vw, 3.9rem);
      line-height: 1.04;
      max-width: 15ch
    }

    .hw {
      display: inline-block;
      opacity: 0;
      transform: translateY(.5em);
      animation: fadeUp .7s var(--ease) calc(var(--i)*.09s + .2s) forwards
    }

    .hw.at {
      color: var(--gold)
    }

    /* header must stay above the page content */
    #top {
      position: sticky;
      top: 0;
      z-index: 80;
      background: color-mix(in srgb, var(--panel) 95%, transparent);
      backdrop-filter: blur(14px) saturate(1.4)
    }

    main,
    footer,
    #bar {
      position: relative;
      z-index: 1
    }

    /* construction scene */
    .hgrid {
      display: grid;
      grid-template-columns: 1.05fr .95fr;
      gap: 2rem;
      align-items: center
    }

    .hr {
      position: relative;
      min-width: 0
    }

    .scene {
      position: relative;
      max-width: 520px;
      margin-inline: auto
    }

    .scene svg {
      width: 100%;
      height: auto;
      overflow: visible;
      filter: drop-shadow(0 18px 26px rgba(0, 0, 0, .18))
    }

    .replay {
      display: block;
      margin: .4rem auto 0;
      padding: .35rem .9rem;
      border-radius: 9999px;
      border: 1px solid var(--line);
      background: var(--panel);
      font-size: .78rem;
      font-weight: 600;
      transition: transform .2s var(--ease), background .2s
    }

    .replay:hover {
      transform: translateY(-2px);
      background: var(--panel2)
    }

    .scene .b {
      animation-duration: .8s;
      animation-delay: var(--d, 0s);
      animation-fill-mode: both;
      animation-timing-function: var(--ease);
      transform-box: fill-box
    }

    .scene .ground {
      fill: none;
      stroke: var(--gold);
      stroke-width: 3;
      stroke-linecap: round;
      stroke-dasharray: 440;
      animation-name: sDraw;
      animation-duration: .9s
    }

    .scene .fnd {
      fill: var(--gold);
      animation-name: sX;
      transform-origin: 50% 50%
    }

    .scene .up {
      animation-name: sUp;
      transform-origin: 50% 100%;
      animation-duration: 1s
    }

    .scene .pop {
      animation-name: sPop;

      ED = { id: id || null, items: [], removed: [] };
      const v = x => esc(x ?? '');
      openModal(`<h2>${id ? 'Edit property' : 'Add property'}</h2><div class="frm">
    <div class="full"><label class="lbl">Title</label><input id="e_title" class="inp" value="${v(L.title)}" placeholder="e.g. 4-bedroom duplex with BQ"></div>
    <div><label class="lbl">Type</label><select id="e_type">${opt(Object.entries(TL), L.type)}</select></div>
    <div><label class="lbl">Purpose</label><select id="e_purpose">${opt([['sale', 'For sale'], ['rent', 'To let / lease']], L.purpose)}</select></div>
    <div><label class="lbl">Asking price (₦)</label><input id="e_price" class="inp" type="number" min="0" value="${v(L.price)}"></div>
    <div><label class="lbl">Lease period</label><select id="e_period">${opt([['year', 'per year'], ['month', 'per month']], L.period)}</select></div>
    <div><label class="lbl">Location (area, city)</label><input id="e_loc" class="inp" value="${v(L.location)}"></div>
    <div><label class="lbl">Address (optional)</label><input id="e_addr" class="inp" value="${v(L.address)}"></div>
    <div><label class="lbl">Bedrooms</label><input id="e_beds" class="inp" type="number" min="0" value="${v(L.beds)}"></div>
    <div><label class="lbl">Bathrooms</label><input id="e_baths" class="inp" type="number" min="0" value="${v(L.baths)}"></div>
    <div><label class="lbl">Size (m²)</label><input id="e_size" class="inp" type="number" min="0" value="${v(L.size)}"></div>
    <div><label class="lbl">Status</label><select id="e_status">${opt([['available', 'Available'], ['sold', 'Sold'], ['rented', 'Leased']], L.status)}</select></div>
    <div><label class="lbl">Inspection fee (₦, blank = default)</label><input id="e_fee" class="inp" type="number" min="0" value="${v(L.inspectionFee)}"></div>
    <div><label class="lbl">Pay-now amount (₦)</label><input id="e_pay" class="inp" type="number" min="0" value="${v(L.payNow)}" placeholder="deposit / first payment"></div>
    <div class="full"><label class="lbl">Features (comma separated)</label><input id="e_feat" class="inp" value="${v((L.features || []).join(', '))}" placeholder="Swimming pool, 24h power, Fenced, CCTV"></div>
    <div class="full"><label class="lbl">Description</label><textarea id="e_desc" class="inp" rows="5" placeholder="Describe the property...">${v(L.desc)}</textarea></div>
    <div class="full"><label class="lbl">Photos <span id="e_cnt" class="muted"></span> (first photo is the cover)</label><div id="e_media" class="mgrid"></div><input type="file" accept="image/*" multiple onchange="edAdd(this)"></div>
    <div class="full" style="margin-top:.7rem"><label class="lbl">Video links (one per line: YouTube or direct .mp4 link)</label><textarea id="e_videos" class="inp" rows="2">${v((L.videos || []).join('\n'))}</textarea>${CFG.cloudinary.cloud ? '<button class="btn2" onclick="uploadVideo()">⬆ Upload a video file</button>' : '<p class="small muted">Tip: upload videos to YouTube (unlisted) or Cloudinary and paste the link here.</p>'}</div>
    <div class="full" style="margin:.9rem 0"><label><input id="e_featured" type="checkbox" ${L.featured ? 'checked' : ''}> ★ Feature this property (shows in the Featured row)</label></div></div>
    <button class="btn w100" onclick="saveListing()">${id ? 'Save changes' : 'Publish property'}</button>`, true);
      renderEdMedia();
      if (id) { try { const s = await getDocs(query(collection(fs, 'listings', id, 'media'), orderBy('n'))); ED.items = s.docs.map(d => ({ id: d.id, data: d.data().data, n: d.data().n, n0: d.data().n })); renderEdMedia() } catch (e) { showErr('Loading photos', e) } }
    }
    function renderEdMedia() {
      const el = $('e_media'); if (!el || !ED) return; ED.items.sort((a, b) => a.n - b.n);
      el.innerHTML = ED.items.map((m, i) => `<div class="mi ${i === 0 ? 'cover' : ''}"><img src="${m.data}" alt=""><span class="cv">${i === 0 ? 'COVER' : ''}</span><div class="mt">${i ? `<button onclick="edCover(${i})" title="Make cover" aria-label="Make cover">★</button>` : ''}<button onclick="edDel(${i})" title="Remove" aria-label="Remove photo">🗑</button></div></div>`).join('') || '<p class="muted small">No photos yet.</p>';
      $('e_cnt').textContent = ED.items.length + '/12';
    }
    async function edAdd(inp) {
      const files = [...inp.files]; inp.value = ''; if (!files.length) return;
      if (ED.items.length + files.length > 12) return toast('Maximum 12 photos per property', 'warning');
      Swal.fire({ title: 'Processing photos…', allowOutsideClick: false, didOpen: () => Swal.showLoading() });
      try { let k = 0; for (const f of files) ED.items.push({ id: null, data: await compress(f), n: Date.now() + (k++), n0: null }) } catch { toast('One of the files is not a supported image', 'error') }
      Swal.close(); renderEdMedia();
    }
    const edDel = i => { const m = ED.items[i]; if (m.id) ED.removed.push(m.id); ED.items.splice(i, 1); renderEdMedia() };
    const edCover = i => { ED.items[i].n = ED.items[0].n - 1; renderEdMedia() };
    async function saveListing() {
      const g = id => $(id).value.trim(), num = id => g(id) === '' ? null : +g(id);
      if (!g('e_title')) return toast('Enter a title', 'error'); if (!(num('e_price') > 0)) return toast('Enter the asking price', 'error'); if (!g('e_loc')) return toast('Enter a location', 'error');
      Swal.fire({ title: 'Saving…', allowOutsideClick: false, didOpen: () => Swal.showLoading() });
      try {
        const lid = ED.id || doc(collection(fs, 'listings')).id; ED.items.sort((a, b) => a.n - b.n);
        const data = { title: g('e_title'), type: g('e_type'), purpose: g('e_purpose'), status: g('e_status'), price: num('e_price'), period: g('e_period'), location: g('e_loc'), address: g('e_addr'), beds: num('e_beds'), baths: num('e_baths'), size: num('e_size'), inspectionFee: num('e_fee'), payNow: num('e_pay') || 0, features: g('e_feat').split(/[,\n]/).map(x => x.trim()).filter(Boolean), desc: $('e_desc').value.trim(), videos: $('e_videos').value.split('\n').map(x => x.trim()).filter(Boolean), featured: $('e_featured').checked, cover: ED.items[0] ? await thumb(ED.items[0].data) : null, imgCount: ED.items.length, updatedAt: Date.now() };
        if (!ED.id) data.createdAt = Date.now();
        await setDoc(doc(fs, 'listings', lid), data, { merge: true });
        await Promise.all(ED.removed.map(mid => deleteDoc(doc(fs, 'listings', lid, 'media', mid))));
        for (const m of ED.items) {
          if (!m.id) await setDoc(doc(collection(fs, 'listings', lid, 'media')), { data: m.data, n: m.n });
          else if (m.n !== m.n0) await updateDoc(doc(fs, 'listings', lid, 'media', m.id), { n: m.n });
        }
        const wasNew = !ED.id; Swal.close(); closeModal(); toast(wasNew ? 'Property published 🎉' : 'Property updated'); ED = null;
      } catch (e) { Swal.close(); showErr('Saving property', e) }
    }
    function uploadVideo() {
      const { cloud, preset } = CFG.cloudinary, inp = document.createElement('input'); inp.type = 'file'; inp.accept = 'video/*';
      inp.onchange = async () => {
        const f = inp.files[0]; if (!f) return; if (f.size > 100 * 1024 * 1024) return toast('Video must be under 100MB', 'error');
        Swal.fire({ title: 'Uploading video…', text: 'Please keep this tab open.', allowOutsideClick: false, didOpen: () => Swal.showLoading() });
        try { const fd = new FormData(); fd.append('file', f); fd.append('upload_preset', preset); const r = await fetch(`https://api.cloudinary.com/v1_1/${cloud}/video/upload`, { method: 'POST', body: fd }), j = await r.json(); if (!j.secure_url) throw new Error(j.error?.message || 'Upload failed'); const ta = $('e_videos'); ta.value = (ta.value.trim() + '\n' + j.secure_url).trim(); Swal.close(); toast('Video uploaded') } catch (e) { Swal.close(); showErr('Video upload', e) }
      };
      inp.click();
    }

    // ===== admin: announcements =====
    function tAnns() {
      $('atab').innerHTML = `<div class="fx jb ac" style="margin-bottom:.9rem"><span class="muted small">${S.anns.length} announcement(s)</span><button class="btn" onclick="editAnn()">＋ New announcement</button></div><div class="anns">${S.anns.map(x => `<div class="ann" style="cursor:default">${x.image ? `<img src="${x.image}" alt="">` : ''}<div class="f1"><b>${x.pinned ? '📌 ' : ''}${esc(x.title)}</b><p class="muted small">${esc((x.body || '').slice(0, 90))}</p><span class="small muted">${dstr(x.createdAt)}</span><div class="fx g3" style="margin-top:.4rem"><button class="lnk" onclick="editAnn('${x.id}')">Edit</button><button class="lnk bad" onclick="delAnn('${x.id}')">Delete</button></div></div></div>`).join('') || '<p class="muted">No announcements yet.</p>'}</div>`;
    }
    function editAnn(id) {
      const x = id ? S.anns.find(a => a.id === id) : { title: '', body: '', video: '', pinned: false, image: null }; AE = { id: id || null, image: x.image || null };
      openModal(`<h2>${id ? 'Edit' : 'New'} announcement</h2><label class="lbl">Title</label><input id="a_title" class="inp" value="${esc(x.title)}"><label class="lbl">Message</label><textarea id="a_body" class="inp" rows="5">${esc(x.body)}</textarea><label class="lbl">Video link (optional)</label><input id="a_video" class="inp" value="${esc(x.video || '')}" placeholder="YouTube or .mp4 link"><label class="lbl">Image (optional)</label><div id="a_prev"></div><input type="file" accept="image/*" onchange="annImg(this)"><p style="margin:.8rem 0"><label><input id="a_pin" type="checkbox" ${x.pinned ? 'checked' : ''}> 📌 Pin to the top (also shows in the top banner)</label></p><button class="btn w100" onclick="saveAnn()">${id ? 'Save changes' : 'Publish'}</button>`);
      annPrev();
    }
    const annPrev = () => { const el = $('a_prev'); if (el) el.innerHTML = AE?.image ? `<div class="fx ac g3" style="margin-bottom:.4rem"><img src="${AE.image}" style="width:90px;border-radius:.5rem" alt=""><button class="lnk bad" onclick="annRm()">Remove image</button></div>` : '' };
    const annRm = () => { AE.image = null; annPrev() };
    async function annImg(inp) { const f = inp.files[0]; if (!f) return; try { AE.image = await compress(f, 900); annPrev() } catch { toast('Unsupported image', 'error') } }
    async function saveAnn() {
      const t = $('a_title').value.trim(), b = $('a_body').value.trim(); if (!t || !b) return toast('Add a title and a message', 'error');
      try { const id = AE.id || doc(collection(fs, 'announcements')).id, d = { title: t, body: b, video: $('a_video').value.trim(), pinned: $('a_pin').checked, image: AE.image || null, updatedAt: Date.now() }; if (!AE.id) d.createdAt = Date.now(); await setDoc(doc(fs, 'announcements', id), d, { merge: true }); closeModal(); toast('Announcement saved') } catch (e) { showErr('Saving announcement', e) }
    }
    async function delAnn(id) { const r = await Swal.fire({ title: 'Delete announcement?', icon: 'warning', showCancelButton: true, confirmButtonText: 'Delete' }); if (r.isConfirmed) deleteDoc(doc(fs, 'announcements', id)).then(() => toast('Deleted', 'info')).catch(e => showErr('Deleting', e)) }

    // ===== admin: settings =====
    function tSettings() {
      const s = S.settings, left = Math.max(0, MAX_ADMINS - S.admins.length);
      $('atab').innerHTML = `<div class="g2c"><div class="panel"><h3 style="margin-bottom:.8rem">Business details</h3><label class="lbl">Business name</label><input id="s_brand" class="inp" value="${esc(s.brand || CFG.brand)}"><label class="lbl">Headline on the home page</label><input id="s_tag" class="inp" value="${esc(s.tagline || '')}" placeholder="Find your next home, shop or office"><label class="lbl">Phone / WhatsApp number</label><input id="s_phone" class="inp" value="${esc(s.phone || '')}" placeholder="0803 000 0000"><label class="lbl">Email</label><input id="s_email" class="inp" type="email" value="${esc(s.email || '')}"><label class="lbl">Office address</label><input id="s_addr" class="inp" value="${esc(s.address || '')}"><label class="lbl">Default inspection fee (₦, 0 = free)</label><input id="s_fee" class="inp" type="number" min="0" value="${esc(s.defaultFee ?? 0)}"><button class="btn" onclick="saveSettings()">Save settings</button></div>
  <div class="panel"><h3 style="margin-bottom:.3rem">Admin team</h3><p class="small muted" style="margin-bottom:.8rem">${S.admins.length} of ${MAX_ADMINS} admin accounts used${left ? ` · ${left} slot${left > 1 ? 's' : ''} left` : ' · limit reached'}</p>${S.admins.map(a => `<div class="up"><div class="d"><b>${esc((a.name || '?')[0].toUpperCase())}</b></div><div class="f1"><b class="tr">${esc(a.name)}${S.user.uid === a.uid ? ' (you)' : ''}</b><div class="small muted tr">${esc(a.email)} · since ${dstr(a.createdAt)}</div></div></div>`).join('') || '<p class="muted small">No admins found.</p>'}<p class="small muted" style="margin-top:.8rem">Everyone logs in with the same form. Admin status comes from the account itself. ${left ? 'A new admin signs up from “Sign up → Have an admin access code?”.' : 'The admin limit is reached, so the admin sign-up option is hidden.'} To remove an admin, delete their document in the <b>admins</b> collection and lower <b>meta/adminCount</b> by 1.</p></div></div>`;
    }
    async function saveSettings() {
      try { await setDoc(doc(fs, 'settings', 'site'), { brand: $('s_brand').value.trim() || CFG.brand, tagline: $('s_tag').value.trim(), phone: $('s_phone').value.trim(), email: $('s_email').value.trim(), address: $('s_addr').value.trim(), defaultFee: +$('s_fee').value || 0 }, { merge: true }); toast('Settings saved') } catch (e) { showErr('Saving settings', e) }
    }

    window.addEventListener('unhandledrejection', e => { const m = String(e.reason?.message || ''); if (m && !/Config missing/.test(m)) showErr('Something went wrong', e.reason) });
    window.addEventListener('hashchange', () => { if (location.hash.startsWith('#l=')) openListing(location.hash.slice(3)) });
    Object.assign(window, { S, toggleTheme, closeModal, closeLb, lbGo, openLb, G_i, go, openAuth, authGo, googleGo, resetPw, becomeAdmin, profile, setF, openListing, openAnn, openNotes, toggleSave, toggleCmp, clearCmp, openCompare, scrollFeat, galGo, galSet, calc, showMap, shareL, askAdmin, bookInspection, startDeal, makeOffer, sendChat, closeBar, setTab, setReqStatus, toggleVerify, delReq, exportCSV, setRF, S_rf, setMF, addCal, clearF, pickScene, quick, setArea, setLayout, setRQ, shareWA, printL, dupListing, exportListings, uq_set, openUser, msgUser, pickThread, setLStatus, delListing, editListing, edAdd, edDel, edCover, saveListing, uploadVideo, editAnn, annImg, annRm, saveAnn, delAnn, saveSettings, toast, Swal });
    startPublic();
  </script>
</body>

</html>
